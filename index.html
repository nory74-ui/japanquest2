      const raw = localStorage.getItem("japanquest_zipang_v6_save") || localStorage.getItem("japanquest_loto_v5_save");
      if (!raw) return false;
      const data = JSON.parse(raw);
      this.buildAuthenticJapanMap();
      this.px = data.px; this.py = data.py;
      this.dir = data.dir || "DOWN";
      this.inShip = !!data.inShip; this.hasShip = !!data.hasShip;
      this.lv = data.lv; this.exp = data.exp; this.gold = data.gold;
      this.maxHp = data.maxHp; this.hp = data.hp;
      this.maxMp = data.maxMp; this.mp = data.mp;
      this.baseAtk = data.baseAtk || 15;
      this.equipBonus = data.equipBonus || 0;
      this.equipName = data.equipName || "ジパングの短剣";
      this.jobTitle = data.jobTitle || "旅の見習い";
      this.overcomeCount = data.overcomeCount || 0;
      this.clearedPrefs = new Set(data.clearedPrefs || []);
      this.regionCrests = new Set(data.regionCrests || []);
      this.boughtEquips = new Set(data.boughtEquips || []);
      this.defeatedMonsters = new Set(data.defeatedMonsters || [1]);
      this.steps = data.steps || 0;
      this.clearedPrefs.forEach(pid => {
        const p = this.prefById[pid];
        if (p) this.grid[p.y][p.x] = TILE_CASTLE_CLEAR;
      });
      if (data.finalIslandRevealed || this.clearedPrefs.size >= 47) {
        this.revealFinalBossIsland();
      }
      return true;
    } catch (e) {
      return false;
    }
  }

  wrapTextLines(text, maxWidth, fontSize = 15) {
    this.ctx.font = `bold ${fontSize}px "Hiragino Kaku Gothic ProN", "Meiryo", sans-serif`;
    const result = [];
    let current = "";
    for (const ch of text) {
      const test = current + ch;
      if (this.ctx.measureText(test).width > maxWidth && current.length > 0) {
        result.push(current);
        current = ch;
      } else {
        current = test;
      }
    }
    if (current) result.push(current);
    return result;
  }

  drawTextFitted(x, y, text, maxWidth, col = BASE_PALETTE["7"], baseSize = 15) {
    let size = baseSize;
    this.ctx.font = `bold ${size}px "Hiragino Kaku Gothic ProN", "Meiryo", sans-serif`;
    while (size > 10 && this.ctx.measureText(text).width > maxWidth) {
      size -= 0.5;
      this.ctx.font = `bold ${size}px "Hiragino Kaku Gothic ProN", "Meiryo", sans-serif`;
    }
    this.ctx.fillStyle = col;
    this.ctx.textBaseline = "top";
    this.ctx.fillText(text, x, y, maxWidth);
  }

  drawTextInBox(x, y, w, h, text, col = BASE_PALETTE["7"], startSize = 15, maxLines = 2) {
    this.ctx.save();
    this.ctx.beginPath();
    this.ctx.rect(x, y, w, h);
    this.ctx.clip();

    let fontSize = startSize;
    let lines = this.wrapTextLines(text, w - 4, fontSize);
    while (lines.length > maxLines && fontSize > 11) {
      fontSize -= 0.5;
      lines = this.wrapTextLines(text, w - 4, fontSize);
    }

    const lineHeight = Math.min(Math.floor(h / Math.max(1, Math.min(lines.length, maxLines))), fontSize + 4);
    for (let i = 0; i < Math.min(lines.length, maxLines); i++) {
      let lineStr = lines[i];
      if (i === maxLines - 1 && lines.length > maxLines) {
        lineStr = lines.slice(i).join("");
      }
      this.drawTextFitted(x, y + i * lineHeight, lineStr, w - 4, col, fontSize);
    }
    this.ctx.restore();
  }

  showMessage(lines, callback = null) {
    const wrapped = [];
    lines.forEach(line => {
      const parts = this.wrapTextLines(line, 444, 15.5);
      parts.forEach(p => wrapped.push(p));
    });
    this.msgQueue = wrapped;
    this.showNextMsgPage(callback);
  }

  showNextMsgPage(callback) {
    if (!this.msgQueue || this.msgQueue.length === 0) {
      this.msgWaiting = false;
      this.msgLines = [];
      if (callback) callback();
      return;
    }
    this.msgLines = this.msgQueue.splice(0, 4);
    this.msgCharIdx = 0;
    this.msgWaiting = true;
    this.afterMsgCallback = () => {
      if (this.msgQueue.length > 0) {
        this.showNextMsgPage(callback);
      } else if (callback) {
        callback();
      }
    };
  }

  // --------------------------------------------------------------------------
  // スマホ操作エンジン：数学的中心角度による360度スライド十字キー＆長押しリピート
  // --------------------------------------------------------------------------
  startHoldDirection(dir) {
    if (!dir) return;
    if (this.holdDir === dir && this.holdTimer) return;
    this.stopHoldDirection();
    this.holdDir = dir;
    this.updateDpadVisual(dir);
    this.vibrate(10);
    this.handleInput(dir);

    this.holdTimer = setInterval(() => {
      if (this.state === STATE_FIELD && !this.msgWaiting && !this.showWorldMap && !this.showZukan) {
        this.handleInput(this.holdDir);
      } else if (this.showZukan && (this.holdDir === "UP" || this.holdDir === "DOWN")) {
        this.handleInput(this.holdDir);
      }
    }, 150);
  }

  stopHoldDirection() {
    this.holdDir = null;
    if (this.holdTimer) {
      clearInterval(this.holdTimer);
      this.holdTimer = null;
    }
    this.updateDpadVisual(null);
  }

  updateDpadVisual(activeDir) {
    document.querySelectorAll(".dpad-btn").forEach(btn => {
      if (btn.getAttribute("data-dir") === activeDir) {
        btn.classList.add("active");
      } else {
        btn.classList.remove("active");
      }
    });
  }

  bindInputs() {
    const unlockAudio = () => {
      this.audio.init();
      if (this.state === STATE_TITLE && !this.audio.bgmTimer) {
        this.audio.startBgm("TITLE");
      }
    };
    window.addEventListener("touchstart", unlockAudio, { passive: true });
    window.addEventListener("pointerdown", unlockAudio, { passive: true });

    // PCキーボード操作
    window.addEventListener("keydown", (e) => {
      const k = e.key.toLowerCase();
      if (["arrowup", "arrowdown", "arrowleft", "arrowright", " ", "enter", "z", "x", "w", "a", "s", "d", "m", "n"].includes(k)) {
        e.preventDefault();
      }
      this.audio.init();
      if (this.state === STATE_TITLE && !this.audio.bgmTimer) {
        this.audio.startBgm("TITLE");
      }
      if (k === "m") {
        this.showWorldMap = !this.showWorldMap;
        this.showZukan = false;
        this.audio.sfxCursor();
        return;
      }
      if (k === "n") {
        this.showZukan = !this.showZukan;
        this.showWorldMap = false;
        this.audio.sfxCursor();
        return;
      }
      if (k === "arrowup" || k === "w") this.handleInput("UP");
      else if (k === "arrowdown" || k === "s") this.handleInput("DOWN");
      else if (k === "arrowleft" || k === "a") this.handleInput("LEFT");
      else if (k === "arrowright" || k === "d") this.handleInput("RIGHT");
      else if (k === "z" || k === "enter" || k === " ") this.handleInput("A");
      else if (k === "x" || k === "backspace" || k === "escape") this.handleInput("B");
    });

    // 1. 数学的座標判定による「隙間なしスライド十字キー」（iOS/Android Touch + Pointer両対応）
    const dpadContainer = document.getElementById("dpadContainer");
    const calcDirFromCoords = (clientX, clientY) => {
      const rect = dpadContainer.getBoundingClientRect();
      const cx = rect.left + rect.width / 2;
      const cy = rect.top + rect.height / 2;
      const dx = clientX - cx;
      const dy = clientY - cy;
      if (Math.hypot(dx, dy) < 10) return null; // 中央のニュートラルゾーン
      if (Math.abs(dx) > Math.abs(dy)) {
        return dx > 0 ? "RIGHT" : "LEFT";
      } else {
        return dy > 0 ? "DOWN" : "UP";
      }
    };

    dpadContainer.addEventListener("touchstart", (e) => {
      e.preventDefault();
      this.audio.init();
      const t = e.touches[0];
      const dir = calcDirFromCoords(t.clientX, t.clientY);
      if (dir) this.startHoldDirection(dir);
    }, { passive: false });

    dpadContainer.addEventListener("touchmove", (e) => {
      e.preventDefault();
      const t = e.touches[0];
      const dir = calcDirFromCoords(t.clientX, t.clientY);
      if (dir && dir !== this.holdDir) {
        this.startHoldDirection(dir);
      } else if (!dir) {
        this.stopHoldDirection();
      }
    }, { passive: false });

    dpadContainer.addEventListener("touchend", (e) => {
      e.preventDefault();
      this.stopHoldDirection();
    }, { passive: false });
    dpadContainer.addEventListener("touchcancel", () => this.stopHoldDirection());

    // PCマウス用フォールバック
    let mouseDownOnDpad = false;
    dpadContainer.addEventListener("mousedown", (e) => {
      mouseDownOnDpad = true;
      this.audio.init();
      const dir = calcDirFromCoords(e.clientX, e.clientY);
      if (dir) this.startHoldDirection(dir);
    });
    window.addEventListener("mousemove", (e) => {
      if (!mouseDownOnDpad) return;
      const dir = calcDirFromCoords(e.clientX, e.clientY);
      if (dir && dir !== this.holdDir) this.startHoldDirection(dir);
    });
    window.addEventListener("mouseup", () => {
      if (mouseDownOnDpad) {
        mouseDownOnDpad = false;
        this.stopHoldDirection();
      }
    });

    // 2. A / B ボタン（touchstart直結で遅延ゼロ）
    document.querySelectorAll("[data-action]").forEach(btn => {
      const act = btn.getAttribute("data-action");
      const triggerAct = (e) => {
        e.preventDefault();
        this.audio.init();
        this.vibrate(14);
        btn.classList.add("active");
        this.handleInput(act);
      };
      const releaseAct = (e) => {
        if (e) e.preventDefault();
        btn.classList.remove("active");
      };
      btn.addEventListener("touchstart", triggerAct, { passive: false });
      btn.addEventListener("touchend", releaseAct, { passive: false });
      btn.addEventListener("touchcancel", releaseAct);
      btn.addEventListener("mousedown", triggerAct);
      btn.addEventListener("mouseup", releaseAct);
      btn.addEventListener("mouseleave", releaseAct);
    });

    // 3. ゲーム画面（Canvas）の直接タップ操作
    const onCanvasTouch = (clientX, clientY) => {
      this.audio.init();
      this.vibrate(10);
      const rect = this.canvas.getBoundingClientRect();
      const cx = ((clientX - rect.left) / rect.width) * 512;
      const cy = ((clientY - rect.top) / rect.height) * 448;
      this.handleCanvasTap(cx, cy);
    };
    this.canvas.addEventListener("touchstart", (e) => {
      e.preventDefault();
      const t = e.touches[0];
      onCanvasTouch(t.clientX, t.clientY);
    }, { passive: false });
    this.canvas.addEventListener("touchend", (e) => {
      e.preventDefault();
      this.stopHoldDirection();
    }, { passive: false });
    this.canvas.addEventListener("mousedown", (e) => {
      onCanvasTouch(e.clientX, e.clientY);
    });
    this.canvas.addEventListener("mouseup", () => this.stopHoldDirection());

    // 4. 上部ショートカットボタン（スマホで確実に反応するタッチ＆クリックバインド）
    const bindFastBtn = (id, handler) => {
      const el = document.getElementById(id);
      if (!el) return;
      let touched = false;
      el.addEventListener("touchstart", (e) => {
        e.preventDefault();
        touched = true;
        this.audio.init();
        this.vibrate(12);
        el.classList.add("pressed");
        handler();
        setTimeout(() => el.classList.remove("pressed"), 150);
      }, { passive: false });
      el.addEventListener("click", (e) => {
        if (touched) { touched = false; return; }
        this.audio.init();
        handler();
      });
    };

    bindFastBtn("btnShrine", () => {
      if (this.state === STATE_FIELD && !this.msgWaiting) {
        this.startShrineTrial();
      } else if (this.state === STATE_TITLE) {
        this.resetPlayer();
        this.loadGame();
        this.state = STATE_FIELD;
        this.startShrineTrial();
      }
    });

    bindFastBtn("btnMap", () => {
      this.showWorldMap = !this.showWorldMap;
      this.showZukan = false;
      this.audio.sfxCursor();
    });

    bindFastBtn("btnZukan", () => {
      this.showZukan = !this.showZukan;
      this.showWorldMap = false;
      this.audio.sfxCursor();
    });

    bindFastBtn("btnSound", () => {
      const soundBtn = document.getElementById("btnSound");
      this.audio.enabled = !this.audio.enabled;
      soundBtn.textContent = this.audio.enabled ? "🔊 音:ON" : "🔇 音:OFF";
      if (!this.audio.enabled) this.audio.stopBgm();
      else if (this.state === STATE_BATTLE) {
        this.audio.startBgm(this.currentEnemy && this.currentEnemy.isFinal ? "FINAL_BOSS" : "BATTLE");
      } else if (this.state === STATE_ENDING) this.audio.startBgm("ENDING");
      else if (this.state === STATE_TITLE) this.audio.startBgm("TITLE");
      else this.audio.startBgm("FIELD");
    });

    bindFastBtn("fullscreenBtn", () => {
      if (!document.fullscreenElement) {
        document.documentElement.requestFullscreen().catch(() => {});
      } else {
        document.exitFullscreen().catch(() => {});
      }
    });
  }

  handleCanvasTap(cx, cy) {
    if (this.flashTimer > 0) return;

    if (this.showWorldMap) {
      this.handleInput("A");
      return;
    }

    if (this.showZukan) {
      if (cy < 58) {
        if (cx > 430) this.handleInput("B");
        else this.handleInput("RIGHT");
      } else if (cy < 230) {
        this.handleInput("UP");
      } else {
        this.handleInput("DOWN");
      }
      return;
    }

    if (this.msgWaiting) {
      this.handleInput("A");
      return;
    }

    if (this.state === STATE_TITLE) {
      if (cx >= 110 && cx <= 402 && cy >= 254 && cy <= 388) {
        const idx = Math.floor((cy - 254) / 30);
        if (idx >= 0 && idx <= 3) {
          this.titleCursor = idx;
          this.handleInput("A");
          return;
        }
      }
      this.handleInput("A");
      return;
    }

    if (this.state === STATE_BATTLE) {
      if (this.battlePhase === "QUIZ" && this.currentQuiz) {
        for (let i = 0; i < 4; i++) {
          const boxY = 251 + i * 44;
          if (cy >= boxY && cy <= boxY + 43 && cx >= 12 && cx <= 500) {
            if (!this.hiddenChoices.has(i)) {
              this.quizCursor = i;
              this.handleInput("A");
            }
            return;
          }
        }
      } else if (this.battlePhase === "COMMAND") {
        if (cx >= 16 && cx <= 264 && cy >= 176 && cy <= 286) {
          const col = cx >= 140 ? 1 : 0;
          const row = cy >= 232 ? 1 : 0;
          this.battleCursor = row * 2 + col;
          this.handleInput("A");
          return;
        }
      } else if (this.battlePhase === "SPELL") {
        const bSpells = this.getSpells().filter(s => s.battle);
        if (cx >= 16 && cx <= 302 && cy >= 198 && cy <= 198 + bSpells.length * 28) {
          const idx = Math.floor((cy - 198) / 28);
          if (idx >= 0 && idx < bSpells.length) {
            this.spellCursor = idx;
            this.handleInput("A");
            return;
          }
        } else {
          this.handleInput("B");
        }
      }
      return;
    }

    if (this.state === STATE_MENU) {
      if (cx >= 248 && cx <= 502 && cy >= 80 && cy <= 198) {
        const col = cx >= 375 ? 1 : 0;
        const row = Math.min(2, Math.max(0, Math.floor((cy - 82) / 34)));
        this.menuCursor = row * 2 + col;
        this.handleInput("A");
      } else {
        this.handleInput("B");
      }
      return;
    }

    if (this.state === STATE_SHOP) {
      if (cx >= 56 && cx <= 456 && cy >= 124 && cy <= 216) {
        const idx = Math.min(2, Math.max(0, Math.floor((cy - 124) / 30)));
        this.shopCursor = idx;
        this.handleInput("A");
      } else {
        this.handleInput("B");
      }
      return;
    }

    if (this.state === STATE_SPELL) {
      const fSpells = this.getSpells().filter(s => s.field);
      if (cx >= 232 && cx <= 502 && cy >= 82 && cy <= 82 + fSpells.length * 30) {
        const idx = Math.floor((cy - 82) / 30);
        if (idx >= 0 && idx < fSpells.length) {
          this.spellCursor = idx;
          this.handleInput("A");
        }
      } else {
        this.handleInput("B");
      }
      return;
    }

    if (this.state === STATE_LURA) {
      const list = this.getWarpDestinations();
      if (cx >= 176 && cx <= 500 && cy >= 70 && cy <= 254) {
        const row = Math.floor((cy - 70) / 30);
        const realIdx = this.luraScroll + row;
        if (realIdx >= 0 && realIdx < list.length) {
          this.luraCursor = realIdx;
          this.handleInput("A");
        }
      } else {
        this.handleInput("B");
      }
      return;
    }

    if (this.state === STATE_STATUS || this.state === STATE_ENDING) {
      this.handleInput("A");
      return;
    }

    if (this.state === STATE_FIELD) {
      const dx = cx - 256;
      const dy = cy - 224;
      if (Math.abs(dx) < 52 && Math.abs(dy) < 52) {
        this.handleInput("A");
      } else if (Math.abs(dx) > Math.abs(dy)) {
        this.startHoldDirection(dx > 0 ? "RIGHT" : "LEFT");
      } else {
        this.startHoldDirection(dy > 0 ? "DOWN" : "UP");
      }
    }
  }

  handleInput(key) {
    if (this.flashTimer > 0) return;

    if (this.showWorldMap) {
      if (key === "A" || key === "B") {
        this.showWorldMap = false;
        this.audio.sfxCursor();
      }
      return;
    }

    if (this.showZukan) {
      if (key === "B") {
        this.showZukan = false;
        this.audio.sfxCursor();
      } else if (key === "LEFT" || key === "RIGHT") {
        this.zukanTab = 1 - this.zukanTab;
        this.zukanCursor = 0;
        this.audio.sfxCursor();
      } else if (key === "UP") {
        const max = this.zukanTab === 0 ? 47 : MONSTER_CATALOG.length;
        this.zukanCursor = (this.zukanCursor - 1 + max) % max;
        this.audio.sfxCursor();
      } else if (key === "DOWN") {
        const max = this.zukanTab === 0 ? 47 : MONSTER_CATALOG.length;
        this.zukanCursor = (this.zukanCursor + 1) % max;
        this.audio.sfxCursor();
      }
      return;
    }

    if (this.msgWaiting) {
      const total = this.msgLines.reduce((acc, l) => acc + l.length, 0);
      if (this.msgCharIdx < total) {
        this.msgCharIdx = total;
      } else if (key === "A" || key === "B") {
        this.audio.sfxCursor();
        this.msgWaiting = false;
        this.msgLines = [];
        if (this.afterMsgCallback) {
          const cb = this.afterMsgCallback;
          this.afterMsgCallback = null;
          cb();
        }
      }
      return;
    }

    if (this.state === STATE_TITLE) {
      this.audio.startBgm("TITLE");
      if (key === "UP") {
        this.audio.sfxCursor();
        this.titleCursor = (this.titleCursor + 3) % 4;
      } else if (key === "DOWN") {
        this.audio.sfxCursor();
        this.titleCursor = (this.titleCursor + 1) % 4;
      } else if (key === "A") {
        this.audio.sfxCursor();
        if (this.titleCursor === 0) {
          this.resetPlayer();
          this.state = STATE_FIELD;
          this.audio.startBgm("FIELD");
          this.showMessage([
            "長老「よくぞ参った、古の開拓者ジパングの志を継ぐ若者よ！",
            "日本全国47都道府県の『高校入試地理バトル』を制覇し、すべての土地に知識の光を取り戻すのだ！",
            "全47都道府県を制覇した時、南の海に『忘却の大魔王の島』が浮上するであろう！」"
          ]);
        } else if (this.titleCursor === 1) {
          if (this.loadGame()) {
            this.state = STATE_FIELD;
            this.audio.startBgm("FIELD");
            this.showMessage(["旅の記録帳 から 冒険を再開しました！"]);
          } else {
            this.showMessage(["記録された 旅の記録帳 が ありません。"]);
          }
        } else if (this.titleCursor === 2) {
          this.resetPlayer();
          this.loadGame();
          this.state = STATE_FIELD;
          this.startShrineTrial();
        } else {
          this.showWorldMap = true;
        }
      }
    } else if (this.state === STATE_FIELD) {
      if (key === "A") {
        this.audio.sfxCursor();
        this.menuCursor = 0;
        this.state = STATE_MENU;
        return;
      }
      let dx = 0, dy = 0;
      if (key === "UP") { dy = -1; this.dir = "UP"; }
      else if (key === "DOWN") { dy = 1; this.dir = "DOWN"; }
      else if (key === "LEFT") { dx = -1; this.dir = "LEFT"; }
      else if (key === "RIGHT") { dx = 1; this.dir = "RIGHT"; }

      if (dx !== 0 || dy !== 0) {
        const nx = this.px + dx, ny = this.py + dy;
        if (nx >= 0 && nx < this.mapW && ny >= 0 && ny < this.mapH) {
          const tile = this.grid[ny][nx];
          if (tile === TILE_SEA) {
            if (this.hasShip) {
              this.px = nx; this.py = ny;
              this.inShip = true;
              this.onStep();
            }
          } else {
            this.px = nx; this.py = ny;
            this.inShip = false;
            this.onStep();
          }
        }
      }
    } else if (this.state === STATE_MENU) {
      if (key === "B") {
        this.audio.sfxCursor();
        this.state = STATE_FIELD;
      } else if (key === "UP") {
        this.audio.sfxCursor();
        this.menuCursor = (this.menuCursor + 4) % 6;
      } else if (key === "DOWN") {
        this.audio.sfxCursor();
        this.menuCursor = (this.menuCursor + 2) % 6;
      } else if (key === "LEFT" || key === "RIGHT") {
        this.audio.sfxCursor();
        this.menuCursor ^= 1;
      } else if (key === "A") {
        this.audio.sfxCursor();
        if (this.menuCursor === 0) this.cmdTalk();
        else if (this.menuCursor === 1) { this.spellCursor = 0; this.state = STATE_SPELL; }
        else if (this.menuCursor === 2) { this.shopCursor = 0; this.state = STATE_SHOP; }
        else if (this.menuCursor === 3) this.startShrineTrial();
        else if (this.menuCursor === 4) this.state = STATE_STATUS;
        else if (this.menuCursor === 5) {
          this.saveGame();
          this.state = STATE_FIELD;
          this.showMessage([
            "長老「これまでの旅の軌跡を『旅の記録帳』に書き記したぞ！",
            "次の旅路も気をつけて行くがよい！」"
          ]);
        }
      }
    } else if (this.state === STATE_SHOP) {
      if (key === "B") {
        this.audio.sfxCursor();
        this.state = STATE_MENU;
      } else if (key === "UP") {
        this.audio.sfxCursor();
        this.shopCursor = (this.shopCursor + 2) % 3;
      } else if (key === "DOWN") {
        this.audio.sfxCursor();
        this.shopCursor = (this.shopCursor + 1) % 3;
      } else if (key === "A") {
        this.executeShopPurchase();
      }
    } else if (this.state === STATE_SPELL) {
      const fSpells = this.getSpells().filter(s => s.field);
      if (key === "B") {
        this.audio.sfxCursor();
        this.state = STATE_MENU;
      } else if (key === "UP") {
        this.audio.sfxCursor();
        this.spellCursor = (this.spellCursor - 1 + fSpells.length) % fSpells.length;
      } else if (key === "DOWN") {
        this.audio.sfxCursor();
        this.spellCursor = (this.spellCursor + 1) % fSpells.length;
      } else if (key === "A") {
        const sp = fSpells[this.spellCursor];
        if (this.mp < sp.mp) {
          this.audio.sfxDamage();
          this.state = STATE_FIELD;
          this.showMessage(["MPが たりない！"]);
          return;
        }
        if (sp.id === "HEAL" || sp.id === "GHEAL") {
          this.mp -= sp.mp;
          const heal = sp.id === "HEAL" ? 35 : 95;
          this.hp = Math.min(this.maxHp, this.hp + heal);
          this.audio.sfxSpell();
          this.state = STATE_FIELD;
          this.showMessage([`ゆうしゃは ${sp.name}の術を つかった！`, "キズが かいふくした！"]);
        } else if (sp.id === "WARP") {
          if (this.clearedPrefs.size === 0 && !this.finalIslandRevealed) {
            this.state = STATE_FIELD;
            this.showMessage(["まだ ヒショウで 飛べる場所が ありません！"]);
          } else {
            this.audio.sfxCursor();
            this.luraCursor = 0;
            this.luraScroll = 0;
            this.state = STATE_LURA;
          }
        }
      }
    } else if (this.state === STATE_LURA) {
      const list = this.getWarpDestinations();
      if (key === "B") {
        this.audio.sfxCursor();
        this.state = STATE_SPELL;
      } else if (key === "UP") {
        this.audio.sfxCursor();
        this.luraCursor = (this.luraCursor - 1 + list.length) % list.length;
      } else if (key === "DOWN") {
        this.audio.sfxCursor();
        this.luraCursor = (this.luraCursor + 1) % list.length;
      } else if (key === "A") {
        const dest = list[this.luraCursor];
        this.mp -= 3;
        this.px = dest.x; this.py = dest.y;
        this.inShip = false;
        this.audio.sfxSpell();
        this.flashTimer = 12;
        this.state = STATE_FIELD;
        this.showMessage([
          "ゆうしゃは ヒショウの術を つかった！",
          `【${dest.label}】へ 一瞬で 飛翔した！`
        ]);
      }
      if (this.luraCursor < this.luraScroll) this.luraScroll = this.luraCursor;
      else if (this.luraCursor >= this.luraScroll + 6) this.luraScroll = this.luraCursor - 5;
    } else if (this.state === STATE_STATUS) {
      if (key === "A" || key === "B") {
        this.audio.sfxCursor();
        this.state = STATE_MENU;
      }
    } else if (this.state === STATE_BATTLE) {
      this.handleBattleInput(key);
    } else if (this.state === STATE_ENDING) {
      if (key === "A" && this.endingScrollY > 420) {
        this.resetPlayer();
        this.state = STATE_TITLE;
        this.audio.startBgm("TITLE");
      }
    }
  }

  getWarpDestinations() {
    const dests = [];
    if (this.finalIslandRevealed) {
      dests.push({ x: this.demonCastlePos.x, y: this.demonCastlePos.y - 1, label: "★終焉の浮上島（ラスボス城前）" });
    }
    Array.from(this.clearedPrefs).sort((a, b) => a - b).forEach(pid => {
      const p = this.prefById[pid];
      dests.push({ x: p.x, y: p.y, label: `${p.name}（${p.capital}）` });
    });
    return dests;
  }

  executeShopPurchase() {
    const nearPref = this.findNearestPref(false);
    this.state = STATE_FIELD;

    if (this.shopCursor === 0) {
      const cost = 20;
      const foodName = nearPref.specialty.split("・")[0];
      if (this.gold >= cost) {
        this.gold -= cost;
        this.hp = this.maxHp;
        this.mp = this.maxMp;
        this.audio.sfxSpell();
        this.showMessage([
          `商人「まいど！${nearPref.name}の特産『${foodName}』ですね！」`,
          "ゆうしゃの HPとMPが ぜんかいふくした！",
          `💡${nearPref.trivia}`
        ]);
      } else {
        this.audio.sfxDamage();
        this.showMessage(["商人「おや、ゴールドが たりないようですよ。」"]);
      }
    } else if (this.shopCursor === 1) {
      const cost = 80;
      if (this.boughtEquips.has(nearPref.id)) {
        this.showMessage([`商人「${nearPref.name}の『${nearPref.equipName}』は すでに お持ちですね！」`]);
        return;
      }
      if (this.gold >= cost) {
        this.gold -= cost;
        this.boughtEquips.add(nearPref.id);
        this.equipBonus += 3;
        this.equipName = nearPref.equipName;
        this.audio.sfxFanfare();
        this.showMessage([
          `商人「まいどあり！${nearPref.name}の伝統武具『${nearPref.equipName}』をお渡しします！」`,
          "ゆうしゃの こうげきりょくが +3 あがった！",
          `💡【入試工業・都市】${nearPref.name}：${nearPref.craft}`
        ], () => this.audio.startBgm("FIELD"));
      } else {
        this.audio.sfxDamage();
        this.showMessage([`商人「『${nearPref.equipName}』は 80ゴールドですよ！」`]);
      }
    } else {
      this.state = STATE_MENU;
    }
  }

  onStep() {
    this.steps++;
    const key = `${this.px},${this.py}`;
    if (this.prefByPos[key]) {
      const pid = this.prefByPos[key];
      const pref = this.prefById[pid];
      if (!this.clearedPrefs.has(pid)) {
        this.stopHoldDirection();
        this.startBattle(pref, true);
      }
      return;
    }
    if (this.px === this.shrinePos.x && this.py === this.shrinePos.y) {
      this.stopHoldDirection();
      this.startShrineTrial();
      return;
    }
    if (this.finalIslandRevealed && this.px === this.demonCastlePos.x && this.py === this.demonCastlePos.y) {
      this.stopHoldDirection();
      this.startFinalBoss();
      return;
    }

    const tile = this.grid[this.py][this.px];
    const rate = this.inShip ? 0.045 : (tile === TILE_FOREST || tile === TILE_MOUNTAIN ? 0.095 : 0.055);
    if (Math.random() < rate) {
      this.stopHoldDirection();
      this.startBattle(this.findNearestPref(false), false);
    }
  }

  findNearestPref(onlyUncleared = false) {
    let best = this.prefById[13];
    let bestDist = 999999;
    Object.values(this.prefById).forEach(p => {
      if (onlyUncleared && this.clearedPrefs.has(p.id)) return;
      const d = (p.x - this.px) ** 2 + (p.y - this.py) ** 2;
      if (d < bestDist) { bestDist = d; best = p; }
    });
    return best;
  }

  cmdTalk() {
    this.state = STATE_FIELD;
    const p = this.findNearestPref(false);
    this.showMessage([
      `学者「ここは ${REGIONS[p.region]}地方の【${p.name}（県庁：${p.capital}）】じゃ！`,
      `地形・自然：${p.feature}`,
      `農水産業：${p.specialty} / 工業・都市：${p.craft}`,
      `💡${p.trivia}`
    ]);
  }

  startShrineTrial() {
    this.stopHoldDirection();
    this.flashTimer = 14;
    this.audio.startBgm("BATTLE");
    this.state = STATE_BATTLE;
    this.battlePhase = "COMMAND";
    this.battleCursor = 0;
    this.quizCursor = 0;
    this.hiddenChoices = new Set();
    this.attackBuff = false;
    this.askedInBattle = new Set();

    const hasWeak = this.weakQuestions && this.weakQuestions.length > 0;
    const targetPref = hasWeak
      ? (this.prefById[this.weakQuestions[0].prefId] || this.prefById[13])
      : this.prefById[Math.floor(Math.random() * 47) + 1];

    const shrineSpec = MONSTER_CATALOG.find(m => m.id === 13);
    this.currentEnemy = {
      pref: targetPref,
      spec: shrineSpec,
      name: `【知恵の社の試練官】くろがねむしゃ`,
      hp: 30,
      maxHp: 30,
      atk: 8,
      isBoss: false,
      isFinal: false,
      isShrine: true
    };

    this.generateHighSchoolExamQuiz(targetPref, true);

    if (hasWeak) {
      this.showMessage([
        `知恵の神主「よくぞ参った！現在記録されている弱点問題は【${this.weakQuestions.length}問】じゃ！`,
        "この試練に正解すれば、弱点記録から克服消去され、大賢者への道が開かれよう！」"
      ]);
    } else {
      this.showMessage([
        "知恵の神主「おお、現在記録されている弱点問題は【0問】じゃ！",
        "見事な知識だが、さらなる高みを目指して『入試最難関特訓問題』を授けよう！」"
      ]);
    }
  }

  startBattle(pref, isBoss) {
    this.flashTimer = 14;
    this.audio.startBgm("BATTLE");
    this.state = STATE_BATTLE;
    this.battlePhase = "COMMAND";
    this.battleCursor = 0;
    this.quizCursor = 0;
    this.hiddenChoices = new Set();
    this.attackBuff = false;
    this.askedInBattle = new Set();

    let monSpec;
    if (isBoss) {
      const bossPool = MONSTER_CATALOG.filter(m => m.tier >= 3 && m.tier <= 4);
      monSpec = bossPool[pref.id % bossPool.length];
    } else if (Math.random() < 0.09) {
      monSpec = MONSTER_CATALOG.find(m => m.id === 22);
    } else {
      const maxTier = this.clearedPrefs.size >= 20 ? 3 : (this.clearedPrefs.size >= 7 ? 2 : 1);
      const pool = MONSTER_CATALOG.filter(m => m.tier <= maxTier);
      monSpec = pool[Math.floor(Math.random() * pool.length)];
    }

    const hpBase = isBoss ? 44 : (monSpec.id === 22 ? 25 : 22);
    const enemyHp = hpBase + this.clearedPrefs.size * 2;
    const enemyAtk = (isBoss ? 11 : 7) + Math.floor(this.clearedPrefs.size * 0.8);
    const displayTitle = isBoss
      ? `【${pref.name}の守護獣】${monSpec.name}`
      : `${pref.name}の ${monSpec.name}`;

    this.currentEnemy = {
      pref,
      spec: monSpec,
      name: displayTitle,
      hp: enemyHp,
      maxHp: enemyHp,
      atk: enemyAtk,
      isBoss,
      isFinal: false,
      isShrine: false
    };
    this.generateHighSchoolExamQuiz(pref, false);
    this.showMessage([`${displayTitle} が あらわれた！`]);
  }

  startFinalBoss() {
    this.flashTimer = 22;
    this.audio.startBgm("FINAL_BOSS");
    this.state = STATE_BATTLE;
    this.battlePhase = "COMMAND";
    this.battleCursor = 0;
    this.hiddenChoices = new Set();
    this.attackBuff = false;
    this.askedInBattle = new Set();

    const deck = [];
    const seenQ = new Set();

    const addCandidate = (item) => {
      if (!seenQ.has(item.question)) {
        seenQ.add(item.question);
        deck.push(item);
      }
    };

    this.weakQuestions.forEach(wq => addCandidate(wq));
    this.everMissedQuestions.forEach(mq => addCandidate(mq));

    const shuffledSpecials = fisherYatesShuffle(EXAM_SPECIAL_QUESTIONS);
    for (const sp of shuffledSpecials) {
      if (deck.length >= 10) break;
      addCandidate({
        prefId: 13,
        question: sp.q,
        correctStr: sp.correct,
        wrongs: sp.wrongs,
        memo: sp.memo
      });
    }

    const shuffledPrefs = fisherYatesShuffle(PREF_DATA);
    for (const pRow of shuffledPrefs) {
      if (deck.length >= 10) break;
      const p = this.prefById[pRow[0]];
      const pool = this.buildCandidateQuestionsForPref(p);
      addCandidate(pool[0]);
    }

    this.finalBossDeck = deck;
    this.finalBossTotalQuestions = deck.length;
    this.finalBossClearedCount = 0;

    const bossSpec = MONSTER_CATALOG.find(m => m.id === 24);
    this.currentEnemy = {
      pref: this.prefById[13],
      spec: bossSpec,
      name: "忘却の大魔王 ガイアノクス",
      hp: this.finalBossTotalQuestions * 100,
      maxHp: this.finalBossTotalQuestions * 100,
      atk: 22,
      isBoss: true,
      isFinal: true,
      isShrine: false
    };

    this.loadNextFinalBossQuestion();
    this.showMessage([
      "忘却の大魔王 ガイアノクス「よくぞ47都道府県すべてを制覇し、この浮上島まで辿り着いたな……！",
      `だが貴様がこれまでに苦戦した問題と最難関地理の【全${this.finalBossTotalQuestions}問】すべてに正解せねば、我が封印は破れぬぞ！！」`
    ]);
  }

  loadNextFinalBossQuestion() {
    if (this.finalBossDeck.length === 0) return;
    const nextItem = this.finalBossDeck[0];
    const pref = this.prefById[nextItem.prefId] || this.prefById[13];
    this.currentEnemy.pref = pref;
    const qHeader = `【最終決戦 第${this.finalBossClearedCount + 1}/${this.finalBossTotalQuestions}問】`;
    const cleanQ = nextItem.question.replace(/^【.*?】/, "");
    this.buildRandomizedQuizObject(
      pref,
      `${qHeader}${cleanQ}`,
      nextItem.correctStr,
      nextItem.wrongs,
      nextItem.memo,
      true,
      nextItem.question
    );
  }

  buildCandidateQuestionsForPref(pref) {
    const sameOrNearPool = PREF_DATA.filter(p => p[0] !== pref.id && Math.abs(p[3] - pref.region) <= 1);
    const fallbackPool = PREF_DATA.filter(p => p[0] !== pref.id);
    const sourcePool = sameOrNearPool.length >= 5 ? sameOrNearPool : fallbackPool;
    const o1 = fisherYatesShuffle(sourcePool).slice(0, 3);
    const o2 = fisherYatesShuffle(fallbackPool).slice(0, 3);

    return [
      {
        prefId: pref.id,
        question: `【高校入試・農水産業】${REGIONS[pref.region]}地方の「${pref.name}」における第一次産業の特色として最も適当なものはどれ？`,
        correctStr: pref.specialty,
        wrongs: o1.map(w => w[7]),
        memo: pref.trivia
      },
      {
        prefId: pref.id,
        question: `【高校入試・工業と都市】「${pref.name}」における工業・都市・歴史文化の特色として最も適当なものはどれ？`,
        correctStr: pref.craft,
        wrongs: o1.map(w => w[8]),
        memo: pref.trivia
      },
      {
        prefId: pref.id,
        question: `【高校入試・地形と気候】「${pref.name}」に見られる地形・河川・自然環境の特徴として正しいものはどれ？`,
        correctStr: pref.feature,
        wrongs: o1.map(w => w[6]),
        memo: pref.trivia
      },
      {
        prefId: pref.id,
        question: `【高校入試・総合正誤】「${pref.name}（県庁：${pref.capital}）」に関する地理的特徴の記述として正しいものはどれ？`,
        correctStr: pref.trivia.replaceAll(pref.name, "この県"),
        wrongs: o2.map(w => w[10].replaceAll(w[1], "この県")),
        memo: pref.trivia
      },
      {
        prefId: pref.id,
        question: `【高校入試・都市と行政】『${pref.feature.split("・")[0]}』が見られる「${pref.name}」の都道府県庁所在地はどこ？`,
        correctStr: pref.capital,
        wrongs: o1.map(w => w[2]),
        memo: pref.trivia
      },
      {
        prefId: pref.id,
        question: `【高校入試・産業連関】都道府県庁所在地が「${pref.capital}」である都道府県の農水産業と工業の組み合わせとして正しいのは？`,
        correctStr: `農水産：${pref.specialty.split("・")[0]} ／ 工業・文化：${pref.craft.split("・")[0]}`,
        wrongs: o2.map(w => `農水産：${w[7].split("・")[0]} ／ 工業・文化：${w[8].split("・")[0]}`),
        memo: pref.trivia
      },
      {
        prefId: pref.id,
        question: `【高校入試・地域区分】「${pref.name}」が属する地方ブロックと、その県の代表的な自然地形の組み合わせとして正しいのは？`,
        correctStr: `${REGIONS[pref.region]}地方 ― ${pref.feature.split("・")[0]}`,
        wrongs: o2.map(w => `${REGIONS[w[3]]}地方 ― ${w[6].split("・")[0]}`),
        memo: pref.trivia
      }
    ];
  }

  generateHighSchoolExamQuiz(pref, isShrineMode = false) {
    if (this.currentEnemy && this.currentEnemy.isFinal) {
      this.loadNextFinalBossQuestion();
      return;
    }

    if (isShrineMode && this.weakQuestions && this.weakQuestions.length > 0) {
      const unaskedWeak = this.weakQuestions.filter(wq => !this.askedInBattle.has(wq.question));
      const targetWeak = unaskedWeak.length > 0 ? unaskedWeak[0] : this.weakQuestions[0];
      const wPref = this.prefById[targetWeak.prefId] || pref;
      this.askedInBattle.add(targetWeak.question);
      this.buildRandomizedQuizObject(wPref, targetWeak.question, targetWeak.correctStr, targetWeak.wrongs, targetWeak.memo, true);
      return;
    }

    const prefCandidates = this.buildCandidateQuestionsForPref(pref);
    const specialCandidates = EXAM_SPECIAL_QUESTIONS.map(sp => ({
      prefId: pref.id,
      question: sp.q,
      correctStr: sp.correct,
      wrongs: sp.wrongs,
      memo: sp.memo
    }));

    let allCandidates = [];
    if (isShrineMode || (this.currentEnemy && this.currentEnemy.spec.id === 22)) {
      allCandidates = [...fisherYatesShuffle(specialCandidates), ...fisherYatesShuffle(prefCandidates)];
    } else {
      allCandidates = [...fisherYatesShuffle(prefCandidates), ...fisherYatesShuffle(specialCandidates)];
    }

    const unasked = allCandidates.filter(c => !this.askedInBattle.has(c.question));
    const chosen = unasked.length > 0 ? unasked[0] : allCandidates[0];
    this.askedInBattle.add(chosen.question);

    this.buildRandomizedQuizObject(pref, chosen.question, chosen.correctStr, chosen.wrongs, chosen.memo, false);
  }

  buildRandomizedQuizObject(pref, question, correct, wrongs, memoText, isFromWeakList = false, rawQuestionKey = null) {
    const rawChoices = [correct, ...wrongs.slice(0, 3)];
    let choices = fisherYatesShuffle(rawChoices);
    let answerIdx = choices.indexOf(correct);

    if (answerIdx === this.lastAnswerIdx) {
      this.sameAnswerStreak++;
      if (this.sameAnswerStreak >= 2) {
        const otherIndices = [0, 1, 2, 3].filter(i => i !== answerIdx);
        const swapTarget = otherIndices[Math.floor(Math.random() * otherIndices.length)];
        const tmp = choices[answerIdx];
        choices[answerIdx] = choices[swapTarget];
        choices[swapTarget] = tmp;
        answerIdx = swapTarget;
        this.sameAnswerStreak = 0;
      }
    } else {
      this.sameAnswerStreak = 1;
    }
    this.lastAnswerIdx = answerIdx;

    this.currentQuiz = {
      pref,
      question,
      rawKey: rawQuestionKey || question,
      choices,
      answerIdx,
      correctStr: correct,
      memo: memoText || pref.trivia,
      isFromWeakList
    };
    this.hiddenChoices = new Set();
    this.quizCursor = 0;
  }

  handleBattleInput(key) {
    if (this.battlePhase === "COMMAND") {
      if (key === "UP" || key === "DOWN") {
        this.audio.sfxCursor();
        this.battleCursor ^= 1;
      } else if (key === "LEFT" || key === "RIGHT") {
        this.audio.sfxCursor();
        this.battleCursor = (this.battleCursor + 2) % 4;
      } else if (key === "A") {
        this.audio.sfxCursor();
        if (this.battleCursor === 0) this.battlePhase = "QUIZ";
        else if (this.battleCursor === 1) { this.spellCursor = 0; this.battlePhase = "SPELL"; }
        else if (this.battleCursor === 2) {
          const p = this.currentEnemy.pref;
          this.showMessage([
            `💡【ジパングの入試ヒント：${p.name}（県庁：${p.capital}）】`,
            `${this.currentQuiz ? this.currentQuiz.memo : p.trivia}`
          ]);
        } else if (this.battleCursor === 3) {
          if (this.currentEnemy.isFinal) {
            this.showMessage(["忘却の大魔王からは 逃げられない！"]);
          } else {
            this.audio.startBgm("FIELD");
            this.state = STATE_FIELD;
            this.showMessage([this.currentEnemy.isShrine ? "知恵の社の試練を 中断しました。" : "ゆうしゃは にげだした！"]);
          }
        }
      }
    } else if (this.battlePhase === "SPELL") {
      const bSpells = this.getSpells().filter(s => s.battle);
      if (key === "B") {
        this.audio.sfxCursor();
        this.battlePhase = "COMMAND";
      } else if (key === "UP") {
        this.audio.sfxCursor();
        this.spellCursor = (this.spellCursor - 1 + bSpells.length) % bSpells.length;
      } else if (key === "DOWN") {
        this.audio.sfxCursor();
        this.spellCursor = (this.spellCursor + 1) % bSpells.length;
      } else if (key === "A") {
        const sp = bSpells[this.spellCursor];
        if (this.mp < sp.mp) {
          this.audio.sfxDamage();
          this.battlePhase = "COMMAND";
          this.showMessage(["MPが たりない！"]);
          return;
        }
        this.mp -= sp.mp;
        this.audio.sfxSpell();
        if (sp.id === "HEAL" || sp.id === "GHEAL") {
          const heal = sp.id === "HEAL" ? 35 : 95;
          this.hp = Math.min(this.maxHp, this.hp + heal);
          this.battlePhase = "COMMAND";
          this.showMessage([`ゆうしゃは ${sp.name}の術を つかった！ HPが かいふくした！`]);
        } else if (sp.id === "REVEAL") {
          const wrongs = fisherYatesShuffle([0, 1, 2, 3].filter(i => i !== this.currentQuiz.answerIdx));
          this.hiddenChoices = new Set([wrongs[0], wrongs[1]]);
          this.battlePhase = "QUIZ";
          this.showMessage(["ミヤブリの術！ まちがいの選択肢が 2つ 消え去った！"]);
        } else if (sp.id === "BOOST") {
          this.attackBuff = true;
          this.battlePhase = "QUIZ";
          this.showMessage(["バイリキの術！ 次のクイズ正解ダメージが 2倍になる！"]);
        }
      }
    } else if (this.battlePhase === "QUIZ") {
      if (key === "B") {
        this.audio.sfxCursor();
        this.battlePhase = "COMMAND";
      } else if (key === "UP") {
        this.audio.sfxCursor();
        this.quizCursor = (this.quizCursor + 3) % 4;
      } else if (key === "DOWN") {
        this.audio.sfxCursor();
        this.quizCursor = (this.quizCursor + 1) % 4;
      } else if (key === "A") {
        if (this.hiddenChoices.has(this.quizCursor)) return;
        this.resolveQuizAnswer(this.quizCursor);
      }
    }
  }

  resolveQuizAnswer(chosenIdx) {
    const enemy = this.currentEnemy;
    const memo = this.currentQuiz.memo;

    if (enemy.isFinal) {
      if (chosenIdx === this.currentQuiz.answerIdx) {
        this.audio.sfxHit();
        this.blinkTimer = 16;
        this.finalBossDeck.shift();
        this.finalBossClearedCount++;
        enemy.hp = Math.max(0, this.finalBossDeck.length * 100);
        this.removeWeakQuestion(this.currentQuiz.rawKey);

        if (this.finalBossDeck.length === 0) {
          this.onBattleWin();
        } else {
          this.showMessage([
            `せいかい！！ 封印の鎖を断ち切った！（突破：${this.finalBossClearedCount}/${this.finalBossTotalQuestions}問）`,
            `ガイアノクスに 100ポイントの 大ダメージ！（残り${this.finalBossDeck.length}問）`,
            `💡${memo}`
          ], () => {
            this.loadNextFinalBossQuestion();
            this.battlePhase = "QUIZ";
          });
        }
      } else {
        this.audio.sfxDamage();
        this.shakeTimer = 16;
        const missedItem = this.finalBossDeck.shift();
        this.finalBossDeck.push(missedItem);
        this.addWeakQuestion(this.currentQuiz);

        const edmg = 14;
        this.hp = Math.max(0, this.hp - edmg);
        const cStr = this.currentQuiz.correctStr;
        const cNum = this.currentQuiz.answerIdx + 1;

        if (this.hp <= 0) {
          this.showMessage([
            `ふせいかい！（正解は ${cNum}番：${cStr}）`,
            `ガイアノクスの 暗黒波動！ ${edmg} のダメージ！`,
            "ゆうしゃは ちからつきた……。"
          ], () => {
            this.hp = this.maxHp;
            this.mp = this.maxMp;
            this.px = this.demonCastlePos.x;
            this.py = this.demonCastlePos.y - 1;
            this.inShip = false;
            this.audio.startBgm("FIELD");
            this.state = STATE_FIELD;
            this.showMessage([
              "長老「おお、もう少しのところであった！",
              "ラスボスを倒すには全問正解が必要じゃ。知恵の社で復習し、再び挑むのじゃ！」"
            ]);
          });
        } else {
          this.showMessage([
            `ふせいかい！（正解は ${cNum}番：${cStr}） ゆうしゃは ${edmg} のダメージ！`,
            "ガイアノクス「フハハ！すべての問題に正解せねば我は倒せぬ！この問題は後でもう一度出題するぞ！」",
            `💡${memo}`
          ], () => {
            this.loadNextFinalBossQuestion();
            this.battlePhase = "COMMAND";
          });
        }
      }
      return;
    }

    if (chosenIdx === this.currentQuiz.answerIdx) {
      this.audio.sfxHit();
      this.blinkTimer = 14;
      let dmg = enemy.isShrine ? 30 : (this.atk + Math.floor(Math.random() * 6) + 5);
      let msg1 = "せいかい！ ゆうしゃの こうげき！";
      if (this.attackBuff) {
        dmg *= 2;
        this.attackBuff = false;
        msg1 = "せいかい！ バイリキの力で かいしんの いちげき！！";
      }
      enemy.hp -= dmg;

      let overcomeMsg = null;
      if (this.removeWeakQuestion(this.currentQuiz.rawKey)) {
        this.overcomeCount++;
        if (this.overcomeCount >= 5) this.jobTitle = "大賢者(地理マスター)";
        else if (this.overcomeCount >= 3) this.jobTitle = "けんじゃ(賢者)";
        else if (this.overcomeCount >= 1) this.jobTitle = "まどうし(魔導士)";
        overcomeMsg = `✨【弱点克服！】この問題を完全にマスターした！（残り弱点：${this.weakQuestions.length}問）`;
      }

      if (enemy.hp <= 0) {
        this.onBattleWin(overcomeMsg);
      } else {
        const msgs = [`${msg1} ${enemy.name} に ${dmg}ポイントの ダメージ！`];
        if (overcomeMsg) msgs.push(overcomeMsg);
        msgs.push(`💡${memo}`);
        this.showMessage(msgs, () => {
          this.generateHighSchoolExamQuiz(enemy.pref, enemy.isShrine);
          this.battlePhase = "COMMAND";
        });
      }
    } else {
      this.addWeakQuestion(this.currentQuiz);
      this.audio.sfxDamage();
      this.shakeTimer = 14;
      const edmg = Math.max(4, enemy.atk + Math.floor(Math.random() * 5) - 2);
      this.hp = Math.max(0, this.hp - edmg);
      const cStr = this.currentQuiz.correctStr;
      const cNum = this.currentQuiz.answerIdx + 1;

      if (this.hp <= 0) {
        this.showMessage([
          `ふせいかい！（正解は ${cNum}番：${cStr}）`,
          `📝この問題を『知恵の社の弱点帳（計${this.weakQuestions.length}問）』に記録しました！`,
          `💡${memo}`,
          "ゆうしゃは ちからつきた……。"
        ], () => {
          this.hp = this.maxHp;
          this.mp = this.maxMp;
          this.gold = Math.floor(this.gold / 2);
          const tokyo = this.prefById[13];
          this.px = tokyo.x; this.py = tokyo.y + 1;
          this.inShip = false;
          this.audio.startBgm("FIELD");
          this.state = STATE_FIELD;
          this.showMessage([
            "長老「おお ゆうしゃよ！力尽きてしまうとは……！",
            "間違えた問題は『知恵の社』に記録されておる。復習して再び旅立つのじゃ！」"
          ]);
        });
      } else {
        this.showMessage([
          `ふせいかい！（正解は ${cNum}番：${cStr}） ゆうしゃは ${edmg} のダメージ！`,
          `📝『知恵の社の弱点帳（計${this.weakQuestions.length}問）』に自動記録しました！`,
          `💡${memo}`
        ], () => {
          this.generateHighSchoolExamQuiz(enemy.pref, enemy.isShrine);
          this.battlePhase = "COMMAND";
        });
      }
    }
  }

  onBattleWin(overcomeMsg = null) {
    this.audio.sfxFanfare();
    const enemy = this.currentEnemy;
    const pref = enemy.pref;
    this.defeatedMonsters.add(enemy.spec.id);

    if (enemy.isFinal) {
      this.jobTitle = "伝説のジパング大賢者";
      this.saveGame();
      this.showMessage([
        `全${this.finalBossTotalQuestions}問の試練を完全突破し、忘却の大魔王 ガイアノクスを 打ち倒した！！`,
        "闇の霧が晴れ、日本列島47都道府県すべてに 知識と平和の輝きが 戻った！！"
      ], () => {
        this.endingScrollY = 0;
        this.audio.startBgm("ENDING");
        this.state = STATE_ENDING;
      });
      return;
    }

    const gainExp = enemy.isShrine ? 65 : (enemy.isBoss ? enemy.spec.exp + 25 : enemy.spec.exp);
    const gainGold = enemy.isShrine ? 80 : (enemy.isBoss ? enemy.spec.gold + 40 : enemy.spec.gold);
    this.exp += gainExp;
    this.gold += gainGold;

    const msgs = [
      `${enemy.name} に 勝利した！ けいけんち ${gainExp}P、${gainGold}Gを かくとく！`
    ];
    if (overcomeMsg) msgs.push(overcomeMsg);
    msgs.push(`💡【${pref.name}のまとめ】県庁：${pref.capital} / 農水産：${pref.specialty}`);

    let justCompletedAll47 = false;
    if (enemy.isBoss && !this.clearedPrefs.has(pref.id)) {
      this.clearedPrefs.add(pref.id);
      this.grid[pref.y][pref.x] = TILE_CASTLE_CLEAR;
      msgs.push(`★【${pref.name}】を 制覇し、入試地理ずかんに登録された！（${this.clearedPrefs.size}/47県）`);

      if (this.clearedPrefs.size >= 5 && !this.hasShip) {
        this.hasShip = true;
        msgs.push("★★ 港から『ふね』で 海を渡れるようになった！ ★★");
      }

      const regId = pref.region;
      const regPrefs = PREF_DATA.filter(p => p[3] === regId).map(p => p[0]);
      if (regPrefs.every(pid => this.clearedPrefs.has(pid)) && !this.regionCrests.has(regId)) {
        this.regionCrests.add(regId);
        msgs.push(`★★★ 【${REGIONS[regId]}の紋章】を 手に入れた！ ★★★`);
      }

      if (this.clearedPrefs.size >= 47 && !this.finalIslandRevealed) {
        justCompletedAll47 = true;
      }
    }

    while (this.exp >= this.lv * 40) {
      this.lv++;
      this.maxHp += 12;
      this.maxMp += 5;
      this.baseAtk += 4;
      this.hp = this.maxHp;
      this.mp = this.maxMp;
      msgs.push(`ファンファーレ♪ ゆうしゃは レベル ${this.lv} に あがった！`);
    }

    if (justCompletedAll47) {
      this.revealFinalBossIsland();
      this.saveGame();
      this.showMessage(msgs, () => {
        this.audio.sfxEarthquake();
        this.shakeTimer = 45;
        this.flashTimer = 16;
        this.audio.startBgm("FIELD");
        this.state = STATE_FIELD;
        this.showMessage([
          "ゴゴゴゴゴ……！！ 突然、大地と大海原が 激しく鳴動しはじめた！！",
          "なんと 全47都道府県の紋章が共鳴し、南の海上（房総半島のはるか南沖）に『終焉の浮上島』が姿を現した！！",
          "『ヒショウの術』または船と連絡橋で 浮上島へ乗り込み、忘却の大魔王との最終決戦（10問連続試練）に挑もう！"
        ]);
      });
    } else {
      this.saveGame();
      this.showMessage(msgs, () => {
        this.audio.startBgm("FIELD");
        this.state = STATE_FIELD;
      });
    }
  }

  // ==========================================================================
  // 7. 画面レンダリング（スマホでの視認性を最大化したフォント・枠設計）
  // ==========================================================================
  loop() {
    this.frameCount++;
    if (this.flashTimer > 0) this.flashTimer--;
    if (this.shakeTimer > 0) this.shakeTimer--;
    if (this.blinkTimer > 0) this.blinkTimer--;

    if (this.state === STATE_ENDING) {
      this.endingScrollY += 0.45;
    }

    if (this.msgWaiting) {
      const total = this.msgLines.reduce((a, b) => a + b.length, 0);
      if (this.msgCharIdx < total && this.frameCount % 2 === 0) {
        this.msgCharIdx++;
        if (this.msgCharIdx % 3 === 0) this.audio.sfxCursor();
      }
    }

    this.draw();
    requestAnimationFrame(() => this.loop());
  }

  getUiColor() {
    if (this.hp <= 0) return BASE_PALETTE["8"];
    if (this.hp <= this.maxHp * 0.25) return BASE_PALETTE["9"];
    return BASE_PALETTE["7"];
  }

  drawDqWindow(x, y, w, h, titleLabel = "") {
    const col = this.getUiColor();
    const ctx = this.ctx;
    ctx.fillStyle = "#000000";
    ctx.fillRect(x, y, w, h);

    ctx.strokeStyle = col;
    ctx.lineWidth = 2;
    ctx.strokeRect(x + 3, y + 3, w - 6, h - 6);
    ctx.strokeRect(x + 7, y + 7, w - 14, h - 14);

    if (titleLabel) {
      ctx.font = 'bold 13.5px "Hiragino Kaku Gothic ProN", "Meiryo", sans-serif';
      const tw = Math.min(w - 20, ctx.measureText(titleLabel).width + 14);
      const tx = x + Math.floor((w - tw) / 2);
      ctx.fillStyle = "#000000";
      ctx.fillRect(tx, y + 1, tw, 13);
      this.drawTextFitted(tx + 7, y + 1, titleLabel, tw - 10, col, 13);
    }
  }

  draw() {
    if (this.flashTimer > 0 && this.flashTimer % 2 === 1) {
      this.ctx.fillStyle = "#FFFFFF";
      this.ctx.fillRect(0, 0, 512, 448);
      return;
    }

    this.ctx.save();
    if (this.shakeTimer > 0) {
      const ox = (Math.random() - 0.5) * 10;
      const oy = (Math.random() - 0.5) * 10;
      this.ctx.translate(ox, oy);
    }

    if (this.state === STATE_TITLE) {
      this.drawAuthenticTitleScreen();
    } else if (this.state === STATE_ENDING) {
      this.drawEmotionalEnding();
    } else {
      this.drawField();
      if (this.state === STATE_MENU) this.drawMenu();
      else if (this.state === STATE_SHOP) this.drawShopWindow();
      else if (this.state === STATE_SPELL) this.drawSpellWindow();
      else if (this.state === STATE_LURA) this.drawLuraWindow();
      else if (this.state === STATE_STATUS) this.drawStatusWindow();
      else if (this.state === STATE_BATTLE) this.drawBattle();
    }

    if (this.showWorldMap) this.drawWorldMapModal();
    if (this.showZukan) this.drawZukanModal();
    if (this.msgWaiting) this.drawMessageWindow();

    this.ctx.restore();
  }

  drawAuthenticTitleScreen() {
    const ctx = this.ctx;
    ctx.fillStyle = "#004058";
    ctx.fillRect(0, 0, 512, 448);

    ctx.save();
    ctx.imageSmoothingEnabled = false;
    ctx.drawImage(this.sprites.logoCanvas, 0, 0, 176, 76, 8, 22, 496, 214);
    ctx.restore();

    this.drawTextFitted(104, 214, "〜 ジパング47都道府県・高校入試地理伝説 〜", 312, BASE_PALETTE["a"], 15);

    const f = Math.floor(this.frameCount / 14) % 2;
    const heroHdImg = this.sprites.getSprite("hero_hd_24", HERO_HD_24, 3);
    const dragonImg = this.sprites.getSprite("title_drake", MON_MATRICES.DRAKE, 3);
    const dropImg = this.sprites.getSprite("title_drop", MON_MATRICES.DROP, 2);
    ctx.drawImage(heroHdImg, 32, 272 + (f * 2));
    ctx.drawImage(dropImg, 12, 336 - (f * 2));
    ctx.drawImage(dragonImg, 400, 270 + (f * 2));

    this.drawDqWindow(114, 238, 284, 152, "旅の記録帳（直接タップ可）");
    const weakCount = this.weakQuestions ? this.weakQuestions.length : 0;
    const items = [
      "あたらしく 旅立つ",
      "旅の記録帳 から再開",
      `知恵の社 弱点復習(${weakCount}問)`,
      "日本列島地図を みる"
    ];
    items.forEach((label, idx) => {
      const isSel = this.titleCursor === idx;
      if (isSel) {
        ctx.fillStyle = "#182848";
        ctx.fillRect(126, 256 + idx * 30, 260, 26);
      }
      const mark = isSel ? "▶" : " ";
      const col = isSel ? BASE_PALETTE["a"] : BASE_PALETTE["7"];
      this.drawTextFitted(134, 260 + idx * 30, `${mark} ${label}`, 244, col, 15.5);
    });

    if (!this.audio.unlocked && Math.floor(this.frameCount / 15) % 2 === 0) {
      this.drawTextFitted(96, 398, "♪ 画面タップ または Aボタンで BGMスタート ♪", 330, BASE_PALETTE["b"], 13.5);
    } else {
      this.drawTextFitted(132, 398, "♪ BGM：ジパング序曲（8-BIT 3CH SYNTH）演奏中 ♪", 270, BASE_PALETTE["7"], 13);
    }
    this.drawTextFitted(84, 422, "© 2026 JAPAN QUEST / HIGH SCHOOL EXAM GEOGRAPHY RPG", 350, BASE_PALETTE["6"], 12.5);
  }

  drawField() {
    const ctx = this.ctx;
    ctx.fillStyle = BASE_PALETTE["1"];
    ctx.fillRect(0, 0, 512, 448);

    const viewW = 16, viewH = 14;
    const camX = this.px - 8, camY = this.py - 7;
    const wavePhase = Math.floor(this.frameCount / 18) % 2;

    const forestImg = this.sprites.getSprite("tile_forest", TILE_ART_FOREST, 2);
    const mountainImg = this.sprites.getSprite("tile_mountain", TILE_ART_MOUNTAIN, 2);
    const fujiImg = this.sprites.getSprite("tile_fuji", TILE_ART_FUJI, 2);
    const bridgeImg = this.sprites.getSprite("tile_bridge", TILE_ART_BRIDGE, 2);
    const castleImg = this.sprites.getSprite("tile_castle", TILE_ART_CASTLE, 2);
    const shrineImg = this.sprites.getSprite("tile_shrine", TILE_ART_SHRINE, 2);

    for (let vy = 0; vy < viewH; vy++) {
      for (let vx = 0; vx < viewW; vx++) {
        const mx = camX + vx, my = camY + vy;
        const sx = vx * 32, sy = vy * 32;
        const tile = (mx >= 0 && mx < this.mapW && my >= 0 && my < this.mapH) ? this.grid[my][mx] : TILE_SEA;

        if (tile === TILE_SEA) {
          ctx.fillStyle = BASE_PALETTE["1"];
          ctx.fillRect(sx, sy, 32, 32);
          if ((mx + my + wavePhase) % 3 === 0) {
            ctx.fillStyle = BASE_PALETTE["c"];
            ctx.fillRect(sx + 6, sy + 10, 10, 2);
            ctx.fillRect(sx + 14, sy + 22, 12, 2);
          }
        } else {
          ctx.fillStyle = tile === TILE_SAND ? BASE_PALETTE["f"] : (tile === TILE_DEMON_CASTLE ? BASE_PALETTE["2"] : BASE_PALETTE["3"]);
          ctx.fillRect(sx, sy, 32, 32);

          if (tile === TILE_PLAIN) {
            ctx.fillStyle = BASE_PALETTE["b"];
            ctx.fillRect(sx + 6, sy + 8, 4, 2);
            ctx.fillRect(sx + 20, sy + 22, 4, 2);
          } else if (tile === TILE_SAND) {
            ctx.fillStyle = BASE_PALETTE["9"];
            ctx.fillRect(sx + 8, sy + 12, 4, 2);
            ctx.fillRect(sx + 18, sy + 22, 4, 2);
          } else if (tile === TILE_FOREST) {
            ctx.drawImage(forestImg, sx, sy);
          } else if (tile === TILE_MOUNTAIN) {
            ctx.drawImage(mountainImg, sx, sy);
          } else if (tile === TILE_FUJI) {
            ctx.drawImage(fujiImg, sx, sy);
          } else if (tile === TILE_BRIDGE) {
            ctx.drawImage(bridgeImg, sx, sy);
          } else if (tile === TILE_SHRINE) {
            ctx.drawImage(shrineImg, sx, sy);
          } else if (tile === TILE_CASTLE || tile === TILE_CASTLE_CLEAR) {
            ctx.drawImage(castleImg, sx, sy);
            if (tile === TILE_CASTLE_CLEAR) {
              ctx.fillStyle = BASE_PALETTE["a"];
              ctx.fillRect(sx + 14, sy, 10, 6);
            }
          } else if (tile === TILE_DEMON_CASTLE) {
            ctx.drawImage(castleImg, sx, sy);
            ctx.strokeStyle = BASE_PALETTE["8"];
            ctx.lineWidth = 2;
            ctx.strokeRect(sx + 2, sy + 2, 28, 28);
          }
        }
      }
    }

    const psx = 8 * 32, psy = 7 * 32;
    const animFrame = Math.floor(this.frameCount / 12) % 2;
    if (this.inShip) {
      const shipMat = animFrame === 0 ? SPRITE_SHIP_1 : SPRITE_SHIP_2;
      ctx.drawImage(this.sprites.getSprite(`ship_${animFrame}`, shipMat, 2), psx, psy);
    } else {
      let heroMat = HERO_DOWN_1;
      if (this.dir === "DOWN") heroMat = animFrame === 0 ? HERO_DOWN_1 : HERO_DOWN_2;
      else if (this.dir === "UP") heroMat = animFrame === 0 ? HERO_UP_1 : HERO_UP_2;
      else if (this.dir === "LEFT") heroMat = animFrame === 0 ? HERO_LEFT_1 : HERO_LEFT_2;
      else if (this.dir === "RIGHT") heroMat = animFrame === 0 ? HERO_RIGHT_1 : HERO_RIGHT_2;
      ctx.drawImage(this.sprites.getSprite(`hero_${this.dir}_${animFrame}`, heroMat, 2), psx, psy);
    }

    this.drawDqWindow(10, 10, 194, 144, this.jobTitle);
    const col = this.getUiColor();
    this.drawTextFitted(22, 28, `ＬＶ：${this.lv} (${this.equipName})`, 170, col, 14);
    this.drawTextFitted(22, 50, `ＨＰ：${this.hp}/${this.maxHp}`, 170, col, 15);
    this.drawTextFitted(22, 72, `ＭＰ：${this.mp}/${this.maxMp}`, 170, col, 15);
    this.drawTextFitted(22, 94, `Ｇ ：${this.gold} / 弱点:${this.weakQuestions.length}問`, 170, col, 14);
    this.drawTextFitted(22, 116, `制覇：${this.clearedPrefs.size}/47都道府県`, 170, BASE_PALETTE["a"], 14.5);

    const pid = this.prefByPos[`${this.px},${this.py}`];
    if (pid) {
      const p = this.prefById[pid];
      this.drawDqWindow(252, 10, 250, 50);
      this.drawTextFitted(266, 26, `🏰【${p.name}】県庁:${p.capital}`, 222, BASE_PALETTE["a"], 15);
    } else if (this.px === this.shrinePos.x && this.py === this.shrinePos.y) {
      this.drawDqWindow(252, 10, 250, 50);
      this.drawTextFitted(266, 26, `⛩️【知恵の社】弱点復習の聖地`, 222, BASE_PALETTE["e"], 15);
    } else if (this.finalIslandRevealed && Math.abs(this.px - this.demonCastlePos.x) <= 2 && Math.abs(this.py - this.demonCastlePos.y) <= 2) {
      this.drawDqWindow(242, 10, 260, 50);
      this.drawTextFitted(256, 26, `🌋【終焉の浮上島】大魔王の居城`, 232, BASE_PALETTE["8"], 15);
    }
  }

  drawMenu() {
    this.drawDqWindow(244, 66, 258, 136, "コマンド（タップ可）");
    const cmds = ["はなす", "じゅつ", "めいぶつ屋", "知恵の社", "つよさ", "きろく"];
    cmds.forEach((cmd, i) => {
      const cx = 260 + (i % 2) * 118;
      const cy = 88 + Math.floor(i / 2) * 34;
      const mark = this.menuCursor === i ? "▶" : " ";
      this.drawTextFitted(cx, cy, `${mark}${cmd}`, 110, this.getUiColor(), 15);
    });
  }

  drawShopWindow() {
    const nearPref = this.findNearestPref(false);
    const foodName = nearPref.specialty.split("・")[0];
    const bought = this.boughtEquips.has(nearPref.id);

    this.drawDqWindow(46, 76, 420, 158, `${nearPref.name}の めいぶつ屋`);
    this.drawTextFitted(66, 100, "商人「ご当地の名産品で旅の支度はいかがかな？」", 380, BASE_PALETTE["a"], 14.5);

    const items = [
      `1. 特産『${foodName}』(HP/MP全回復) - 20G`,
      `2. 武具『${nearPref.equipName}』(攻撃+3) - ${bought ? "購入済" : "80G"}`,
      "3. 店をでる"
    ];
    items.forEach((it, idx) => {
      const mark = this.shopCursor === idx ? "▶" : " ";
      const col = this.shopCursor === idx ? BASE_PALETTE["a"] : BASE_PALETTE["7"];
      this.drawTextFitted(66, 130 + idx * 30, `${mark}${it}`, 380, col, 14.5);
    });
  }

  drawSpellWindow() {
    const spells = this.getSpells().filter(s => s.field);
    this.drawDqWindow(228, 66, 274, 42 + spells.length * 30, "じゅつ（術）");
    spells.forEach((sp, i) => {
      const mark = this.spellCursor === i ? "▶" : " ";
      this.drawTextFitted(244, 88 + i * 30, `${mark}${sp.name} (消費MP:${sp.mp})`, 242, this.getUiColor(), 15);
    });
  }

  drawLuraWindow() {
    const list = this.getWarpDestinations();
    this.drawDqWindow(172, 44, 328, 236, "ヒショウ（飛翔移動先）");
    const vis = list.slice(this.luraScroll, this.luraScroll + 6);
    vis.forEach((dest, i) => {
      const realIdx = this.luraScroll + i;
      const mark = realIdx === this.luraCursor ? "▶" : " ";
      const col = dest.label.startsWith("★") ? BASE_PALETTE["e"] : BASE_PALETTE["7"];
      this.drawTextFitted(190, 74 + i * 30, `${mark}${dest.label}`, 294, col, 15);
    });
  }

  drawStatusWindow() {
    this.drawDqWindow(20, 20, 472, 356, "つよさ・もんしょう");
    const col = this.getUiColor();
    const heroHdImg = this.sprites.getSprite("hero_hd_24", HERO_HD_24, 3);
    this.ctx.drawImage(heroHdImg, 396, 42);

    this.drawTextFitted(42, 44, `称号:${this.jobTitle}  Lv.${this.lv} (EXP:${this.exp})`, 346, BASE_PALETTE["a"], 15.5);
    this.drawTextFitted(42, 72, `攻撃力:${this.atk} (武具:${this.equipName})`, 346, col, 14.5);
    this.drawTextFitted(42, 98, `弱点克服数:${this.overcomeCount}問 / 残り弱点:${this.weakQuestions.length}問`, 346, BASE_PALETTE["e"], 14.5);
    this.drawTextFitted(42, 124, `ふね:${this.hasShip ? "入手済" : "未入手(5県制覇)"} / 討伐魔物:${this.defeatedMonsters.size}/24種`, 346, col, 14);
    this.drawTextFitted(42, 152, "【8つの ちほうのもんしょう（地方全県制覇で入手）】", 428, BASE_PALETTE["a"], 15);

    REGIONS.forEach((rName, rId) => {
      const rx = 42 + (rId % 2) * 212;
      const ry = 180 + Math.floor(rId / 2) * 30;
      const has = this.regionCrests.has(rId);
      this.drawTextFitted(rx, ry, `${rName}: ${has ? "★紋章あり" : "・未取得"}`, 200, has ? BASE_PALETTE["a"] : BASE_PALETTE["6"], 15);
    });
    this.drawTextFitted(42, 336, "画面タップ または A / B ボタンで もどる", 428, BASE_PALETTE["6"], 14);
  }

  drawBattle() {
    const enemy = this.currentEnemy;
    if (!enemy) return;

    const winTitle = enemy.isFinal
      ? `最終決戦（突破:${this.finalBossClearedCount}/${this.finalBossTotalQuestions}問）`
      : (enemy.isShrine ? "知恵の社・弱点克服の試練" : (enemy.isBoss ? "守護獣バトル" : "まもの"));

    this.drawDqWindow(184, 8, 318, 162, winTitle);
    if (this.blinkTimer % 2 === 0) {
      const mat = MON_MATRICES[enemy.spec.base];
      const img = this.sprites.getSprite(`mon_${enemy.spec.id}`, mat, 3.8, enemy.spec.swap);
      this.ctx.drawImage(img, 298, 26);
    }
    this.drawTextFitted(200, 140, `${enemy.name}  HP:${Math.max(0, enemy.hp)}`, 286, BASE_PALETTE["7"], 14.5);

    if (this.battlePhase === "COMMAND") {
      this.drawDqWindow(14, 178, 250, 106, "コマンド（直接タップ可）");
      const cmds = ["たたかう", "じゅつ", "入試ヒント", "にげる"];
      cmds.forEach((cmd, i) => {
        const cx = 28 + (i % 2) * 112;
        const cy = 204 + Math.floor(i / 2) * 36;
        const mark = this.battleCursor === i ? "▶" : " ";
        this.drawTextFitted(cx, cy, `${mark}${cmd}`, 104, this.getUiColor(), 15.5);
      });
    } else if (this.battlePhase === "SPELL") {
      const bSpells = this.getSpells().filter(s => s.battle);
      this.drawDqWindow(14, 178, 292, 42 + bSpells.length * 28, "じゅつ（術）");
      bSpells.forEach((sp, i) => {
        const mark = this.spellCursor === i ? "▶" : " ";
        this.drawTextFitted(30, 200 + i * 28, `${mark}${sp.name} (MP:${sp.mp})`, 260, this.getUiColor(), 15);
      });
    } else if (this.battlePhase === "QUIZ" && this.currentQuiz) {
      const qTitle = enemy.isFinal
        ? `🌋 最終試練 残り${this.finalBossDeck.length}問（選択肢タップで解答）`
        : (this.currentQuiz.isFromWeakList ? `⛩️ 弱点克服バトル（残り弱点:${this.weakQuestions.length}問）` : "⚔️ 高校入試 地理バトル（タップ解答可）");

      this.drawDqWindow(6, 174, 500, 268, qTitle);
      this.drawTextInBox(20, 192, 472, 54, this.currentQuiz.question, BASE_PALETTE["a"], 14.5, 3);

      this.ctx.fillStyle = "#3a3a4e";
      this.ctx.fillRect(18, 248, 476, 1);

      this.currentQuiz.choices.forEach((ch, i) => {
        const boxY = 252 + i * 44;
        const isSelected = this.quizCursor === i;

        if (!this.hiddenChoices.has(i)) {
          this.ctx.fillStyle = isSelected ? "#1c2c58" : "#0c101c";
          this.ctx.fillRect(18, boxY - 1, 476, 41);
          this.ctx.strokeStyle = isSelected ? BASE_PALETTE["a"] : "#303848";
          this.ctx.lineWidth = isSelected ? 1.5 : 1;
          this.ctx.strokeRect(18, boxY - 1, 476, 41);
        }

        if (this.hiddenChoices.has(i)) {
          this.drawTextFitted(28, boxY + 9, "  --------------------------------", 452, BASE_PALETTE["5"], 14);
        } else {
          const mark = isSelected ? "▶" : " ";
          const col = isSelected ? BASE_PALETTE["a"] : BASE_PALETTE["7"];
          this.drawTextInBox(22, boxY + 1, 468, 39, `${mark}${i + 1}. ${ch}`, col, 14.5, 2);
        }
      });
    }
  }

  drawZukanModal() {
    this.drawDqWindow(12, 10, 488, 428, "高校入試 地理＆魔物ずかん");
    const t0Col = this.zukanTab === 0 ? BASE_PALETTE["a"] : BASE_PALETTE["6"];
    const t1Col = this.zukanTab === 1 ? BASE_PALETTE["a"] : BASE_PALETTE["6"];
    this.drawTextFitted(28, 34, `◀左右切替▶ [1] 47都道府県(${this.clearedPrefs.size}/47)`, 240, t0Col, 14);
    this.drawTextFitted(276, 34, `[2] 魔物(${this.defeatedMonsters.size}/24)`, 140, t1Col, 14);
    this.drawTextFitted(426, 34, "[×閉じる]", 64, BASE_PALETTE["8"], 13.5);

    if (this.zukanTab === 0) {
      const pid = this.zukanCursor + 1;
      const p = this.prefById[pid];
      const isCleared = this.clearedPrefs.has(pid);

      this.drawDqWindow(24, 58, 464, 340);
      this.drawTextFitted(40, 74, `No.${String(pid).padStart(2, "0")} 【${p.name}】 (${REGIONS[p.region]}地方)  ${isCleared ? "★制覇済" : "・未制覇"}`, 432, isCleared ? BASE_PALETTE["a"] : BASE_PALETTE["7"], 16.5);
      this.drawTextFitted(40, 104, `■ 都道府県庁所在地：${p.capital} ■ ご当地武具：${p.equipName}`, 432, BASE_PALETTE["c"], 14);
      this.drawTextInBox(40, 130, 432, 40, `■ 地形・気候：${p.feature}`, BASE_PALETTE["7"], 13.5, 2);
      this.drawTextInBox(40, 174, 432, 40, `■ 農水産業：${p.specialty}`, BASE_PALETTE["b"], 13.5, 2);
      this.drawTextInBox(40, 218, 432, 40, `■ 工業・都市：${p.craft}`, BASE_PALETTE["9"], 13.5, 2);
      this.drawTextInBox(40, 262, 432, 124, `💡入試解説：${p.trivia}`, BASE_PALETTE["a"], 14, 5);
    } else {
      const mon = MONSTER_CATALOG[this.zukanCursor];
      const seen = this.defeatedMonsters.has(mon.id);
      this.drawDqWindow(24, 58, 464, 340);

      this.drawTextFitted(44, 78, `No.${String(mon.id).padStart(2, "0")} 【${seen ? mon.name : "？？？？？？"}】`, 420, seen ? BASE_PALETTE["a"] : BASE_PALETTE["6"], 17.5);

      const mat = MON_MATRICES[mon.base];
      const swap = seen ? mon.swap : { 0: "5", 1: "5", 2: "5", 3: "5", 4: "5", 5: "5", 6: "5", 7: "5", 8: "5", 9: "5", a: "5", b: "5", c: "5", d: "5", e: "5", f: "5" };
      const img = this.sprites.getSprite(`zukan_mon_${mon.id}_${seen}`, mat, 5, swap);
      this.ctx.drawImage(img, 196, 130);

      this.drawTextFitted(116, 280, `獲得経験値：${mon.exp} EXP / 獲得ゴールド：${mon.gold} G`, 310, BASE_PALETTE["7"], 15);
      this.drawTextFitted(116, 312, seen ? "★ 討伐記録あり（図鑑登録済）" : "・ まだ倒していない魔物です", 310, seen ? BASE_PALETTE["b"] : BASE_PALETTE["6"], 15);
    }

    this.drawTextFitted(68, 406, "画面上下タップor▲▼：ページ送り / Bボタン：とじる", 380, BASE_PALETTE["7"], 13.5);
  }

  drawWorldMapModal() {
    this.drawDqWindow(16, 12, 480, 424, "にほんれっとう ぜんたいちず（画面タップで閉じる）");
    this.drawTextFitted(28, 34, "黄:制覇済 / 赤:未制覇 / 桃:知恵の社 / 紫:浮上島 / 白:現在地", 454, BASE_PALETTE["a"], 13);

    const ox = 62, oy = 56, scale = 3.0;
    for (let y = 0; y < this.mapH; y++) {
      for (let x = 0; x < this.mapW; x++) {
        const t = this.grid[y][x];
        if (t !== TILE_SEA) {
          if (t === TILE_MOUNTAIN) this.ctx.fillStyle = BASE_PALETTE["4"];
          else if (t === TILE_FUJI) this.ctx.fillStyle = "#FFFFFF";
          else if (t === TILE_BRIDGE) this.ctx.fillStyle = BASE_PALETTE["9"];
          else if (t === TILE_DEMON_CASTLE) this.ctx.fillStyle = BASE_PALETTE["2"];
          else this.ctx.fillStyle = BASE_PALETTE["3"];
          this.ctx.fillRect(ox + x * scale, oy + y * scale, scale + 0.4, scale + 0.4);
        }
      }
    }

    PREF_DATA.forEach(p => {
      const [id, , , , x, y] = p;
      this.ctx.fillStyle = this.clearedPrefs.has(id) ? BASE_PALETTE["a"] : BASE_PALETTE["8"];
      this.ctx.fillRect(ox + x * scale - 2, oy + y * scale - 2, 5, 5);
    });

    this.ctx.fillStyle = BASE_PALETTE["e"];
    this.ctx.fillRect(ox + this.shrinePos.x * scale - 3, oy + this.shrinePos.y * scale - 3, 6, 6);

    if (this.finalIslandRevealed) {
      this.ctx.fillStyle = "#FF00FF";
      this.ctx.fillRect(ox + this.demonCastlePos.x * scale - 4, oy + this.demonCastlePos.y * scale - 4, 8, 8);
    }

    if (Math.floor(this.frameCount / 8) % 2 === 0) {
      this.ctx.fillStyle = "#FFFFFF";
      this.ctx.fillRect(ox + this.px * scale - 3, oy + this.py * scale - 3, 8, 8);
    }
  }

  drawMessageWindow() {
    this.drawDqWindow(10, 290, 492, 148);
    const col = this.getUiColor();
    this.ctx.save();
    this.ctx.beginPath();
    this.ctx.rect(20, 300, 472, 124);
    this.ctx.clip();

    let rem = this.msgCharIdx;
    this.msgLines.slice(0, 4).forEach((line, i) => {
      if (rem <= 0) return;
      const sub = line.slice(0, rem);
      this.drawTextFitted(26, 306 + i * 26, sub, 460, col, 15.5);
      rem -= line.length;
    });
    this.ctx.restore();

    const total = this.msgLines.reduce((a, b) => a + b.length, 0);
    if (this.msgCharIdx >= total && Math.floor(this.frameCount / 12) % 2 === 0) {
      this.drawTextFitted(248, 414, "▼", 30, col, 14);
    }
  }

  drawEmotionalEnding() {
    const ctx = this.ctx;
    const skyGrad = ctx.createLinearGradient(0, 0, 0, 220);
    skyGrad.addColorStop(0.0, "#081438");
    skyGrad.addColorStop(0.5, "#384888");
    skyGrad.addColorStop(0.85, "#D87048");
    skyGrad.addColorStop(1.0, "#F8D878");
    ctx.fillStyle = skyGrad;
    ctx.fillRect(0, 0, 512, 200);

    ctx.fillStyle = "#F8F8B8";
    ctx.beginPath();
    ctx.arc(256, 178, 36, 0, Math.PI * 2);
    ctx.fill();

    ctx.fillStyle = "#102458";
    ctx.fillRect(0, 185, 512, 263);

    const f = Math.floor(this.frameCount / 12) % 2;
    const heroHdImg = this.sprites.getSprite("hero_hd_24", HERO_HD_24, 2.5);
    const dropImg = this.sprites.getSprite("end_drop", MON_MATRICES.DROP, 2);
    ctx.drawImage(heroHdImg, 42, 128 + f * 2);
    ctx.drawImage(dropImg, 420, 142 - f * 2);

    this.drawDqWindow(24, 196, 464, 236, "★ GRAND FINALE - 旅の軌跡 ★");

    const credits = [
      { text: "〜 ジパング47都道府県 完全制覇 〜", col: BASE_PALETTE["a"], size: 17 },
      { text: "", col: "#FFF", size: 12 },
      { text: "忘却の大魔王ガイアノクスは倒れ、", col: BASE_PALETTE["7"], size: 15 },
      { text: "日本列島のすべての街と自然に", col: BASE_PALETTE["7"], size: 15 },
      { text: "豊かな知識と平和の光が蘇った。", col: BASE_PALETTE["7"], size: 15 },
      { text: "", col: "#FFF", size: 12 },
      { text: "【あなたが歩んだ47都道府県の記憶】", col: BASE_PALETTE["b"], size: 15.5 },
      { text: "北海道・東北：広大な大地とリンゴ・稲作の恵み", col: BASE_PALETTE["7"], size: 14 },
      { text: "関東：日本の首都圏と近郊農業・臨海工業の躍動", col: BASE_PALETTE["7"], size: 14 },
      { text: "中部：日本の屋根アルプス・扇状地の果樹・機械工業", col: BASE_PALETTE["7"], size: 14 },
      { text: "近畿：千年の歴史文化と琵琶湖の水・阪神の技術", col: BASE_PALETTE["7"], size: 14 },
      { text: "中国・四国：瀬戸内の温暖な気候とカルスト・促成栽培", col: BASE_PALETTE["7"], size: 14 },
      { text: "九州・沖縄：火山の恵み・シラス台地と亜熱帯の珊瑚礁", col: BASE_PALETTE["7"], size: 14 },
      { text: "", col: "#FFF", size: 12 },
      { text: "【最終冒険レコード】", col: BASE_PALETTE["a"], size: 16 },
      { text: `最終称号：${this.jobTitle}`, col: BASE_PALETTE["e"], size: 15 },
      { text: `到達レベル：Lv.${this.lv} ／ 総歩数：${this.steps}歩`, col: BASE_PALETTE["7"], size: 15 },
      { text: `制覇都道府県：47 / 47 完全制覇！`, col: BASE_PALETTE["a"], size: 15 },
      { text: `克服した弱点問題数：${this.overcomeCount}問`, col: BASE_PALETTE["b"], size: 15 },
      { text: `図鑑登録した魔物：${this.defeatedMonsters.size} / 24種`, col: BASE_PALETTE["c"], size: 15 },
      { text: "", col: "#FFF", size: 14 },
      { text: "ここで身につけた日本地理の知識は、", col: BASE_PALETTE["7"], size: 15 },
      { text: "これからの入試、そして未来の旅路を照らす", col: BASE_PALETTE["7"], size: 15 },
      { text: "かけがえのない『一生の宝物』となるだろう。", col: BASE_PALETTE["7"], size: 15 },
      { text: "", col: "#FFF", size: 16 },
      { text: "THANK YOU FOR PLAYING!", col: BASE_PALETTE["a"], size: 18 },
      { text: "― 完 (画面タップまたはAでタイトルへ) ―", col: BASE_PALETTE["b"], size: 15 }
    ];

    ctx.save();
    ctx.beginPath();
    ctx.rect(36, 214, 440, 206);
    this.ctx.clip();

    const maxScroll = credits.length * 26 - 140;
    const curScroll = Math.min(this.endingScrollY, maxScroll);

    credits.forEach((line, idx) => {
      const ly = 390 + idx * 26 - curScroll;
      if (ly > 195 && ly < 425 && line.text) {
        this.drawTextFitted(52, ly, line.text, 408, line.col, line.size);
      }
    });
    ctx.restore();
  }
}

window.addEventListener("DOMContentLoaded", () => new JapanQuestGame());
</script>
</body>
</html>
