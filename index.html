<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, minimum-scale=1.0, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="mobile-web-app-capable" content="yes">
<title>JAPAN QUEST 〜高校入試準拠・ジパング47都道府県伝説〜</title>
<style>
  :root {
    --fc-red: #821420;
    --fc-red-dark: #4e0810;
    --fc-gold: #e0b85c;
    --fc-bg: #050a0e;
  }
  * {
    box-sizing: border-box;
    user-select: none;
    -webkit-user-select: none;
    -webkit-touch-callout: none;
    -webkit-tap-highlight-color: transparent;
  }
  html, body {
    margin: 0;
    padding: 0;
    width: 100%;
    height: 100%;
    background-color: var(--fc-bg);
    color: #fff;
    font-family: "Hiragino Kaku Gothic ProN", "Yu Gothic", "Meiryo", "MS Gothic", sans-serif;
    overflow: hidden;
    overscroll-behavior: none;
    touch-action: none;
    position: fixed;
    inset: 0;
    display: flex;
    align-items: center;
    justify-content: center;
  }

  /* スマホ実機の可視領域に100%フィットするメイン筐体 */
  .game-wrapper {
    background: linear-gradient(180deg, #1c222a 0%, #0e1217 100%);
    width: 100%;
    max-width: 640px;
    height: 100%;
    padding: env(safe-area-inset-top, 4px) 6px env(safe-area-inset-bottom, 6px) 6px;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: space-between;
    gap: 4px;
  }

  /* 上部ナビゲーションバー（スマホで押しやすい4+1ボタン配置） */
  .header-bar {
    width: 100%;
    display: flex;
    flex-direction: column;
    gap: 4px;
    flex-shrink: 0;
  }
  .title-row {
    display: flex;
    justify-content: space-between;
    align-items: center;
    padding: 0 4px;
    font-size: 12px;
    color: var(--fc-gold);
    font-weight: bold;
  }
  .top-btns {
    display: grid;
    grid-template-columns: 1.35fr 1fr 1fr 0.9fr;
    gap: 5px;
    width: 100%;
  }
  .top-btn {
    background: #1c2632;
    color: #fff;
    border: 1.5px solid var(--fc-gold);
    border-radius: 8px;
    padding: 7px 4px;
    font-size: 12px;
    cursor: pointer;
    font-family: inherit;
    font-weight: bold;
    text-align: center;
    white-space: nowrap;
    box-shadow: 0 2px 0 #000;
  }
  .top-btn:active, .top-btn.pressed {
    background: var(--fc-gold);
    color: #000;
    transform: translateY(1px);
  }
  .top-btn.shrine {
    background: #4a154b;
    border-color: #ff99ff;
    color: #ffe6ff;
  }

  /* ゲーム画面コンテナ（JSでスマホの残り高さに合わせて自動スケーリング） */
  .screen-container {
    position: relative;
    width: 100%;
    flex: 1 1 auto;
    min-height: 0;
    display: flex;
    align-items: center;
    justify-content: center;
    overflow: hidden;
  }
  canvas {
    background-color: #004058;
    border: 2.5px solid #e8e8e8;
    border-radius: 6px;
    image-rendering: pixelated;
    display: block;
    touch-action: none;
    box-shadow: 0 4px 16px rgba(0, 0, 0, 0.8);
  }

  /* スマホ親指操作に最適化したファミコン風コントローラー */
  .controller {
    width: 100%;
    padding: 8px 14px 10px 14px;
    background: linear-gradient(180deg, var(--fc-red) 0%, var(--fc-red-dark) 100%);
    border: 2.5px solid var(--fc-gold);
    border-radius: 14px;
    display: flex;
    justify-content: space-between;
    align-items: center;
    flex-shrink: 0;
    box-shadow: inset 0 2px 5px rgba(255, 255, 255, 0.2), 0 4px 12px rgba(0, 0, 0, 0.7);
  }

  /* スライド操作対応・大型十字キー */
  .dpad {
    position: relative;
    width: 144px;
    height: 144px;
    display: grid;
    grid-template-columns: repeat(3, 48px);
    grid-template-rows: repeat(3, 48px);
    touch-action: none;
    flex-shrink: 0;
  }
  .dpad-btn {
    background: #222228;
    border: 2px solid #5a5a66;
    color: #fff;
    font-size: 21px;
    display: flex;
    align-items: center;
    justify-content: center;
    box-shadow: 0 3px 0 #000;
    pointer-events: none; /* 親要素dpadで一括座標判定するため隙間でも反応する */
  }
  .dpad-btn[data-dir="UP"]    { border-radius: 8px 8px 0 0; }
  .dpad-btn[data-dir="DOWN"]  { border-radius: 0 0 8px 8px; }
  .dpad-btn[data-dir="LEFT"]  { border-radius: 8px 0 0 8px; }
  .dpad-btn[data-dir="RIGHT"] { border-radius: 0 8px 8px 0; }
  .dpad-btn.active {
    background: #606075;
    border-color: var(--fc-gold);
    color: var(--fc-gold);
    transform: translateY(2px);
    box-shadow: 0 1px 0 #000;
  }
  .dpad-center {
    background: #1c1c22;
    display: flex;
    align-items: center;
    justify-content: center;
    pointer-events: none;
  }
  .dpad-center::after {
    content: "";
    width: 18px;
    height: 18px;
    border-radius: 50%;
    background: #111115;
    box-shadow: inset 0 2px 4px rgba(0,0,0,0.9);
  }

  /* 中央ガイド（小さいスマホでは自動でコンパクト化） */
  .center-info {
    text-align: center;
    color: var(--fc-gold);
    font-size: 10.5px;
    line-height: 1.35;
    padding: 0 4px;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 4px;
  }
  .touch-badge {
    background: rgba(0, 0, 0, 0.55);
    border: 1px solid var(--fc-gold);
    border-radius: 10px;
    padding: 4px 8px;
    color: #fff;
    font-weight: bold;
    font-size: 10px;
  }

  /* A・Bボタン（親指の角度に合わせた斜め配置） */
  .ab-pad {
    display: flex;
    gap: 14px;
    align-items: center;
    flex-shrink: 0;
  }
  .ab-btn-wrap {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 4px;
  }
  .ab-btn-wrap.b-wrap {
    margin-top: 22px;
  }
  .ab-btn-wrap.a-wrap {
    margin-bottom: 14px;
  }
  .ab-btn {
    width: 64px;
    height: 64px;
    border-radius: 50%;
    background: radial-gradient(circle at 35% 30%, #ff5232, #c81800);
    border: 3px solid #fff;
    color: #fff;
    font-weight: 900;
    font-size: 22px;
    box-shadow: 0 5px 0 #3a0000, 0 8px 14px rgba(0,0,0,0.6);
    cursor: pointer;
    touch-action: none;
    display: flex;
    align-items: center;
    justify-content: center;
  }
  .ab-btn.active {
    transform: translateY(4px);
    box-shadow: 0 1px 0 #3a0000;
    background: #ff7050;
  }
  .ab-label {
    font-size: 11px;
    color: var(--fc-gold);
    font-weight: bold;
    white-space: nowrap;
  }

  @media (max-width: 390px) {
    .center-info {
      display: none;
    }
    .dpad {
      width: 132px;
      height: 132px;
      grid-template-columns: repeat(3, 44px);
      grid-template-rows: repeat(3, 44px);
    }
    .ab-btn {
      width: 58px;
      height: 58px;
      font-size: 20px;
    }
  }

  /* スマホ横持ち（ランドスケープ）時は左右にパッド、中央に大画面 */
  @media (max-height: 520px) and (orientation: landscape) {
    .game-wrapper {
      max-width: 100vw;
      display: grid;
      grid-template-columns: auto 1fr auto;
      grid-template-rows: auto 1fr;
      gap: 2px 8px;
      padding: 4px 10px;
    }
    .header-bar {
      grid-column: 1 / 4;
      grid-row: 1;
      flex-direction: row;
      align-items: center;
      justify-content: space-between;
    }
    .title-row {
      display: none;
    }
    .screen-container {
      grid-column: 2;
      grid-row: 2;
      height: 100%;
    }
    .controller {
      grid-column: 1 / 4;
      grid-row: 2;
      background: transparent;
      border: none;
      box-shadow: none;
      padding: 0;
      pointer-events: none;
      height: 100%;
    }
    .dpad, .ab-pad {
      pointer-events: auto;
    }
    .center-info {
      display: none;
    }
  }
</style>
</head>
<body>

<div class="game-wrapper" id="gameWrapper">
  <div class="header-bar" id="headerBar">
    <div class="title-row">
      <span>⚔️ JAPAN QUEST 〜ジパング47都道府県伝説〜</span>

  </div>

  <div class="screen-container" id="screenContainer">

<script>
// ============================================================================
// 0. スマホ画面サイズ完全自動フィット（アドレスバーでボタンが隠れない動的計算）
// ============================================================================
function fitCanvasToMobileViewport() {
  const wrapper = document.getElementById("gameWrapper");
  const header = document.getElementById("headerBar");
  const screenBox = document.getElementById("screenContainer");
  const controller = document.getElementById("controllerBar");
  const canvas = document.getElementById("gameCanvas");
  if (!wrapper || !screenBox || !canvas) return;

  const vw = window.visualViewport ? window.visualViewport.width : window.innerWidth;
  const vh = window.visualViewport ? window.visualViewport.height : window.innerHeight;
  wrapper.style.height = `${vh}px`;

  const isLandscapeMobile = vh <= 520 && vw > vh;
  let availW, availH;

  if (isLandscapeMobile) {
    availW = vw - 290; // 左右の十字キーとABボタン分を確保
    availH = vh - header.offsetHeight - 16;
  } else {
    availW = Math.min(vw - 12, 628);
    availH = vh - header.offsetHeight - controller.offsetHeight - 22;
  }

  availW = Math.max(180, availW);
  availH = Math.max(150, availH);

  const aspect = 512 / 448;
  let targetW = availW;
  let targetH = targetW / aspect;

  if (targetH > availH) {
    targetH = availH;
    targetW = targetH * aspect;
  }

  canvas.style.width = `${Math.floor(targetW)}px`;
  canvas.style.height = `${Math.floor(targetH)}px`;
}

window.addEventListener("resize", fitCanvasToMobileViewport);
window.addEventListener("orientationchange", () => setTimeout(fitCanvasToMobileViewport, 120));
if (window.visualViewport) {
  window.visualViewport.addEventListener("resize", fitCanvasToMobileViewport);
}

// 3. ピクセルアート『JAPAN QUEST』ロゴ生成エンジン
// ============================================================================
function createAuthenticPixelLogoCanvas() {
  const lw = 176, lh = 76;
  const off = document.createElement("canvas");
  off.width = lw;
  off.height = lh;
  const ctx = off.getContext("2d");
  ctx.imageSmoothingEnabled = false;

  const fillPoly = (pts, color) => {
    ctx.fillStyle = color;
    ctx.beginPath();
    ctx.moveTo(pts[0][0], pts[0][1]);
    for (let i = 1; i < pts.length; i++) ctx.lineTo(pts[i][0], pts[i][1]);
    ctx.closePath();
    ctx.fill();
  };

  const drawExtrudedPoly = (pts, dx, dy, faceCol = "#c8c8c8", sideCol = "#888888", shadowCol = "#202020") => {
    fillPoly(pts.map(([x, y]) => [x + dx + (dx > 0 ? 1 : -1), y + dy + 2]), shadowCol);
    const steps = Math.max(Math.abs(dx), Math.abs(dy));
    for (let s = steps; s >= 1; s--) {
      const ox = Math.round((dx * s) / steps);
      const oy = Math.round((dy * s) / steps);
      fillPoly(pts.map(([x, y]) => [x + ox, y + oy]), sideCol);
    }
    fillPoly(pts, faceCol);
  };

  // 1. 左端の巨大な斜め立体文字『J』
  const jOuter = [
    [10, 14], [35, 22], [49, 51], [45, 57], [30, 62], [22, 54], [27, 46], [35, 49], [25, 27], [13, 23]
  ];
  drawExtrudedPoly(jOuter, -7, 5, "#c8c8c8", "#888888", "#202020");

  // 2. 『APAN QUES』
  drawExtrudedPoly([[43, 29], [53, 32], [60, 54], [54, 56], [52, 49], [47, 48], [48, 55], [43, 54]], -4, 4);
  fillPoly([[48, 36], [51, 37], [52, 43], [48, 43]], "#004058");

  drawExtrudedPoly([[59, 31], [70, 33], [72, 37], [71, 44], [64, 45], [64, 55], [59, 55]], -3, 4);
  fillPoly([[64, 36], [67, 36], [67, 40], [64, 40]], "#004058");

  drawExtrudedPoly([[73, 34], [81, 35], [85, 55], [80, 55], [79, 49], [75, 49], [75, 55], [71, 55]], -2, 4);
  fillPoly([[76, 39], [78, 39], [79, 44], [76, 44]], "#004058");

  drawExtrudedPoly([[85, 35], [89, 35], [94, 45], [94, 35], [98, 35], [98, 55], [94, 55], [89, 45], [89, 55], [85, 55]], -1, 4);

  drawExtrudedPoly([[104, 35], [113, 34], [115, 37], [115, 52], [112, 55], [114, 58], [109, 59], [107, 55], [103, 54], [102, 38]], 2, 4);
  fillPoly([[107, 39], [110, 39], [110, 49], [107, 49]], "#004058");

  drawExtrudedPoly([[116, 33], [121, 32], [121, 49], [124, 49], [124, 31], [129, 30], [129, 52], [126, 55], [118, 55], [116, 52]], 3, 4);

  drawExtrudedPoly([
    [130, 30], [143, 27], [143, 33], [135, 35], [135, 39], [141, 38],
    [141, 43], [135, 44], [135, 49], [143, 48], [143, 54], [130, 55]
  ], 4, 4);

  drawExtrudedPoly([
    [146, 25], [158, 22], [158, 29], [150, 31], [150, 35], [157, 35],
    [157, 49], [154, 53], [144, 54], [144, 47], [152, 46], [152, 41], [145, 41], [145, 29]
  ], 5, 4);

  // 3. 右端の剣になった『T』
  drawExtrudedPoly([[166, 13], [173, 16], [169, 24], [162, 21]], 4, 3, "#c8c8c8", "#888888", "#202020");
  ctx.fillStyle = "#ffffff";
  ctx.fillRect(165, 14, 2, 6);

  drawExtrudedPoly([[156, 20], [175, 27], [172, 34], [153, 27]], 5, 4, "#c8c8c8", "#888888", "#202020");

  const bladePts = [[161, 29], [169, 32], [157, 59], [149, 63], [147, 56]];
  drawExtrudedPoly(bladePts, 6, 4, "#c8c8c8", "#888888", "#181818");
  fillPoly([[161, 29], [165, 30], [153, 58], [149, 62], [147, 56]], "#ffffff");

  // 4. 左端の『J』に重なる黒いドラゴンのシルエット
  const dragonPixels = [
    [22, 6, 6, 1], [29, 6, 2, 1], [35, 5, 2, 2],
    [24, 7, 13, 2], [20, 8, 18, 2], [25, 10, 13, 2],
    [27, 12, 5, 2], [33, 13, 4, 2],
    [26, 14, 6, 3], [24, 17, 8, 3], [22, 20, 10, 4],
    [23, 24, 10, 5], [24, 29, 9, 5], [26, 34, 6, 4], [28, 38, 3, 2],
    [33, 22, 4, 2], [35, 19, 3, 3], [37, 17, 2, 2],
    [32, 24, 4, 7]
  ];
  ctx.fillStyle = "#000000";
  dragonPixels.forEach(([x, y, w, h]) => ctx.fillRect(x, y, w, h));
  ctx.fillStyle = "#c8c8c8";
  ctx.fillRect(30, 7, 2, 1);

  return off;
}

// ============================================================================
// 4. スプライトシート・プリレンダリングエンジン
// ============================================================================
class SpriteEngine {
  constructor() {
    this.cache = new Map();
    this.logoCanvas = createAuthenticPixelLogoCanvas();
  }
  getSprite(key, matrix, scale = 2, swap = {}) {
    const cacheKey = `${key}_${scale}_${JSON.stringify(swap)}`;
    if (this.cache.has(cacheKey)) return this.cache.get(cacheKey);

    const h = matrix.length;
    const w = matrix[0].length;
    const off = document.createElement("canvas");
    off.width = w * scale;
    off.height = h * scale;
    const octx = off.getContext("2d");

    for (let y = 0; y < h; y++) {
      const row = matrix[y];
      for (let x = 0; x < w; x++) {
        const ch = row[x];
        if (ch !== ".") {
          const mapped = swap[ch] || ch;
          octx.fillStyle = BASE_PALETTE[mapped] || "#FFF";
          octx.fillRect(x * scale, y * scale, scale, scale);
        }
      }
    }
    this.cache.set(cacheKey, off);
    return off;
  }
}

// ============================================================================
// 5. Web Audio API 8bit ファミコン音源
// ============================================================================
class ChiptuneAudio {
  constructor() {
    this.ctx = null;
    this.enabled = true;
    this.unlocked = false;
    this.bgmTimer = null;
    this.currentBgm = null;
    this.stepIdx = 0;
  }
  init() {
    if (!this.ctx) {
      const AudioCtx = window.AudioContext || window.webkitAudioContext;
      if (AudioCtx) this.ctx = new AudioCtx();
    }
    if (this.ctx) {
      if (this.ctx.state === "suspended") {
        this.ctx.resume().then(() => { this.unlocked = true; }).catch(() => {});
      } else if (this.ctx.state === "running") {
        this.unlocked = true;
      }
      if (!this.unlocked) {
        try {
          const buf = this.ctx.createBuffer(1, 1, 22050);
          const src = this.ctx.createBufferSource();
          src.buffer = buf;
          src.connect(this.ctx.destination);
          src.start(0);
          this.unlocked = true;
        } catch (e) {}
      }
    }
  }
  playTone(freq, duration, type = "square", vol = 0.065, delay = 0) {
    if (!this.enabled || !this.ctx) return;
    const now = this.ctx.currentTime + delay;
    const osc = this.ctx.createOscillator();
    const gain = this.ctx.createGain();
    osc.type = type;
    osc.frequency.setValueAtTime(freq, now);
    gain.gain.setValueAtTime(vol, now);
    gain.gain.exponentialRampToValueAtTime(0.001, now + duration);
    osc.connect(gain);
    gain.connect(this.ctx.destination);
    osc.start(now);
    osc.stop(now + duration);
  }

function fisherYatesShuffle(arr) {
  const copy = [...arr];
  for (let i = copy.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    const tmp = copy[i];
    copy[i] = copy[j];
    copy[j] = tmp;
  }
  return copy;
}

    const item = {

      correctStr: quizObj.correctStr,
      wrongs: quizObj.choices.filter((_, idx) => idx !== quizObj.answerIdx),

    if (!this.weakQuestions.some(wq => wq.question === item.question)) {
